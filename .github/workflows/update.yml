# 매일 새벽 자료를 갱신한다.
# 인증키는 저장소 Settings > Secrets and variables > Actions 에
# DATA_GO_KR_KEY, KOSIS_KEY 로 넣는다. .env 파일은 커밋하지 않는다.
name: 자료 갱신

on:
  schedule:
    - cron: "0 20 * * 0"      # UTC 20:00 = 한국시간 05:00
  workflow_dispatch:           # 필요할 때 수동 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # 외부 API 가 응답하지 않을 때를 대비한 상한. 정상 실행은 2~3분이다.
    timeout-minutes: 20
    env:
      # 파이썬 출력이 버퍼에 모였다가 끝에 한꺼번에 나오면 어느 단계에서
      # 멈췄는지 보이지 않는다. 줄 단위로 바로 내보내게 한다.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
    
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install shapely

      - name: 청약·미분양 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KOSIS_KEY: ${{ secrets.KOSIS_KEY }}
        run: python etl.py

      # 새로 올라온 공고의 우편번호만 좌표를 구한다.
      # 캐시에 있는 건 건너뛰므로 보통 몇 초면 끝난다.
      - name: 단지 좌표 보충
        run: python geocode.py

      - name: 좌표 반영 후 재집계
        run: |
          python etl.py --offline
          python build_standalone.py

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add web/index.json web/region web/geo-cache.json web/standalone.html
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "자료 갱신 $(date -u +%Y-%m-%d)"
          git push
