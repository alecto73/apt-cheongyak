# 매주 새벽 자료를 갱신한다.
# 인증키는 저장소 Settings > Secrets and variables > Actions 에
# DATA_GO_KR_KEY, KOSIS_KEY 로 넣는다. .env 파일은 커밋하지 않는다.
# KAKAO_REST_KEY 는 선택이다. 있으면 대장아파트 좌표를 카카오로 구한다.
name: 자료 갱신

on:
  schedule:
    - cron: "0 20 * * 0"      # UTC 20:00 = 한국시간 05:00
  workflow_dispatch:           # 필요할 때 수동 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # 대장아파트 첫 수집(전국 13개월 실거래)이 길어서 넉넉히 잡는다.
    # 두 번째부터는 지난 달 자료를 캐시에서 꺼내 쓰므로 훨씬 짧다.
    timeout-minutes: 180
    env:
      # 파이썬 출력이 버퍼에 모였다가 끝에 한꺼번에 나오면 어느 단계에서
      # 멈췄는지 보이지 않는다. 줄 단위로 바로 내보내게 한다.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install shapely

      - name: 청약·미분양 수집
        # 외부 서버(청약홈·KOSIS)가 잠시 응답하지 않아도 대장아파트 집계는 따로 돈다.
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KOSIS_KEY: ${{ secrets.KOSIS_KEY }}
        run: python etl.py

      # 새로 올라온 공고의 우편번호만 좌표를 구한다.
      # 캐시에 있는 건 건너뛰므로 보통 몇 초면 끝난다.
      - name: 단지 좌표 보충
        continue-on-error: true
        run: python geocode.py

      - name: 좌표 반영 후 재집계
        continue-on-error: true
        run: python etl.py --offline

      # 대장아파트: 실거래 원자료(raw/rtms)는 커밋하지 않고 Actions 캐시에 둔다.
      # 복원과 저장을 나눈다. actions/cache 하나로 쓰면 작업이 실패로 끝날 때
      # 저장 단계가 건너뛰어져, 오래 받은 원자료가 통째로 사라진다.
      - name: 실거래 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: raw/rtms
          key: rtms-${{ github.run_id }}
          restore-keys: rtms-

      # 실패해도 청약·미분양 갱신은 그대로 커밋되게 한다.
      - name: 대장아파트 집계
        continue-on-error: true
        # 첫 수집은 전국 13개월(약 3,700회 호출)이라 1시간 반 가까이 걸린다.
        timeout-minutes: 150
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python etl_daejang.py

      - name: 실거래 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: raw/rtms
          key: rtms-${{ github.run_id }}

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add web/index.json web/region web/geo-cache.json
          for f in web/daejang web/daejang-geo.json kapt-cache.json; do
            [ -e "$f" ] && git add "$f"
          done
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "자료 갱신 $(date -u +%Y-%m-%d)"
          # 실행 중에 다른 커밋이 올라왔을 수 있다 (긴 수집 중 코드 수정 등).
          git pull --rebase -X theirs origin main || git pull --rebase origin main
          git push
