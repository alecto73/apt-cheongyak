<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eeefea">
<title>청약·미분양·대장아파트 지도</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="청약지도">
<meta name="application-name" content="청약지도">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --paper:#eeefea; --card:#f7f7f4; --ink:#191c18; --rule:#d3d5cc;
  --muted:#6e7269; --blue:#2c4a7c; --ochre:#8a5a12; --warn:#8c3a2b;
  --gold:#b8860b;
  --pad:clamp(12px,1.6vw,22px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
    "Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  font-size:15px; line-height:1.55; -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--blue);text-decoration:none;border-bottom:1px solid rgba(44,74,124,.35)}
a:hover{border-bottom-color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

header{display:flex;flex-wrap:wrap;gap:9px 16px;align-items:center;
  padding:11px var(--pad) 10px;border-bottom:1px solid var(--rule)}
header h1{margin:0;font-size:16px;font-weight:650;letter-spacing:-.02em}
header .src{margin-left:auto;font-size:11.5px;color:var(--muted);
  line-height:1.4;text-align:right}

.layers{display:flex;gap:6px;flex-wrap:wrap}
.layers button{display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--rule);border-radius:999px;padding:4px 11px 4px 8px;
  font-size:12.5px;color:var(--muted);background:var(--card)}
.layers button .sw{width:11px;height:11px;border-radius:50%;flex:0 0 auto;
  background:var(--muted);opacity:.35}
.layers button.on{color:var(--ink);border-color:var(--ink);font-weight:600}
.layers button.on .sw{opacity:1}
.layers button[data-l="cy"].on .sw{background:var(--blue)}
.layers button[data-l="un"].on .sw{background:#8c3a2b}
.layers button[data-l="dj"].on .sw{background:var(--gold)}
.layers button .n{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ── 레이아웃: 지도를 크게, 정보는 좁게 ──────── */
.wrap{display:grid;grid-template-columns:1fr minmax(330px,27%);align-items:start}
.left{padding:var(--pad);min-width:0}
.right{padding:var(--pad) var(--pad) var(--pad) 0;min-width:0;
  border-left:1px solid var(--rule);position:sticky;top:0;
  max-height:100vh;overflow:auto;padding-left:var(--pad)}
@media(max-width:1000px){
  .wrap{grid-template-columns:1fr}
  .right{position:static;max-height:none;overflow:visible;border-left:0;
    border-top:1px solid var(--rule);padding-left:var(--pad)}
}

/* ── 검색·반경 줄 ───────────────────────── */
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.search{position:relative;flex:1 1 260px;min-width:220px}
.search input{width:100%;border:1px solid var(--rule);border-radius:4px;
  padding:7px 11px;font:inherit;font-size:13.5px;background:var(--card);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--ink)}
.sresult{position:absolute;z-index:40;left:0;right:0;top:calc(100% + 3px);
  background:var(--paper);border:1px solid var(--ink);border-radius:4px;
  max-height:280px;overflow:auto;box-shadow:0 6px 20px rgba(0,0,0,.14)}
.sresult button{display:block;width:100%;text-align:left;padding:7px 11px;
  font-size:13px;border-bottom:1px solid var(--rule)}
.sresult button:last-child{border-bottom:0}
.sresult button:hover,.sresult button:focus{background:var(--card)}
.sresult .nm{font-weight:600}
.sresult .ad{color:var(--muted);font-size:12px}
.sresult .none{padding:9px 11px;color:var(--muted);font-size:13px}
.rad{display:flex;gap:0;border:1px solid var(--rule);border-radius:4px;
  overflow:hidden;background:var(--card)}
.rad button{padding:6px 11px;font-size:12.5px;color:var(--muted)}
.rad button+button{border-left:1px solid var(--rule)}
.rad button.on{background:var(--ink);color:var(--paper);font-weight:600}

.crumb{display:flex;align-items:center;gap:8px;margin-bottom:9px;
  font-size:13px;color:var(--muted);flex-wrap:wrap}
.crumb b{color:var(--ink);font-weight:600}
.crumb button{border:1px solid var(--rule);border-radius:3px;
  padding:3px 9px;font-size:12.5px;background:var(--card)}
.crumb button:hover{border-color:var(--ink)}
#map{width:100%;height:calc(100vh - 170px);min-height:420px;
  background:var(--card);border:1px solid var(--rule)}
@media(max-width:1000px){#map{height:52vh;min-height:300px}}

/* 모바일에서는 지도가 손가락 움직임을 다 가져가서 아래 정보로 내려갈
   길이 없다. 떠 있는 단추로 지도 ↔ 정보를 오간다. */
.jump{display:none}
@media(max-width:1000px){
  .jump{display:inline-flex;align-items:center;gap:6px;position:fixed;
    right:14px;bottom:16px;z-index:300;background:var(--ink);color:var(--paper);
    border-radius:999px;padding:10px 16px;font-size:13.5px;font-weight:600;
    box-shadow:0 3px 12px rgba(0,0,0,.35)}
}
.maperr{padding:18px;color:var(--muted);font-size:13.5px;line-height:1.7}

.plab{font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;
  text-shadow:0 0 3px var(--paper),0 0 3px var(--paper),0 0 3px var(--paper);
  pointer-events:none;transform:translate(-50%,-50%)}
.plab.sm{font-size:11px;font-weight:500;color:var(--muted)}
/* 스카이뷰에서는 종이색 글자가 묻힌다. 흰 글자에 검은 테를 둘러 띄운다. */
#map.sky .plab{color:#fff;font-weight:700;
  text-shadow:0 0 3px rgba(0,0,0,.95),0 0 6px rgba(0,0,0,.8),0 1px 2px #000}
#map.sky .plab.sm{color:#e8e8e4;font-weight:600}
#map.sky .pin .tag{background:rgba(18,20,17,.82);color:#f2f3ee;
  border-color:rgba(255,255,255,.35)}

/* ── 단지 표시: 물방울 핀 + 속기호 ─────────── */
.pin{position:relative;width:28px;height:38px;cursor:pointer;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.45));
  transform-origin:bottom center;transition:transform .12s}
.pin svg{display:block;position:relative;z-index:2}
.pin:hover{z-index:60;transform:scale(1.18)}
.pin.sm{width:20px;height:27px}
.pin.dim{opacity:.25}
.pin.sel{z-index:80;transform:scale(1.3);
  filter:drop-shadow(0 0 5px rgba(44,74,124,.95)) drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.pin .tag{position:absolute;left:31px;top:13px;transform:translateY(-50%);
  font-size:11.5px;font-weight:620;white-space:nowrap;color:var(--ink);
  background:rgba(238,239,234,.93);border:1px solid var(--rule);
  border-radius:3px;padding:1px 5px;pointer-events:none;z-index:1}
.pin.sm .tag{left:23px;top:9px;font-size:11px}

.legend{margin-top:10px;font-size:12.5px;color:var(--muted);line-height:2.1}
.legend svg{vertical-align:-5px;margin-right:3px}
.legend span{margin-right:12px;white-space:nowrap;display:inline-block}

/* ── 오른쪽 정보 ───────────────────────── */
.empty{color:var(--muted);padding-top:6px;font-size:13.5px}
h2.place{margin:0 0 2px;font-size:22px;font-weight:680;
  letter-spacing:-.03em;line-height:1.15}
.place-sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
.figs{display:grid;grid-template-columns:repeat(2,1fr);
  border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}
.fig{padding:9px 10px 10px;border-right:1px solid var(--rule)}
.fig:nth-child(2n){border-right:0}
.fig:nth-child(n+3){border-top:1px solid var(--rule)}
.fig .k{font-size:11.5px;color:var(--muted);margin-bottom:2px}
.fig .v{font-size:19px;font-weight:650;letter-spacing:-.03em;line-height:1.2}
.fig .u{font-size:11.5px;font-weight:450;color:var(--muted);margin-left:2px}
.fig.ochre .v{color:var(--ochre)}
.fig .note{font-size:11px;color:var(--muted);margin-top:2px}

h3{font-size:13px;font-weight:640;margin:22px 0 0;
  padding-bottom:6px;border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:7px}
h3 span{font-weight:400;color:var(--muted);font-size:12px;margin-left:auto}
h3 svg{flex:0 0 auto;vertical-align:-3px}

/* 카드. 누르면 지도에서 그 자리를 짚어준다. */
.card{padding:11px 11px 12px;border-bottom:1px solid var(--rule);
  cursor:pointer;scroll-margin-top:12px;transition:background .18s;
  border-left:3px solid transparent;margin-left:-11px}
.card:hover{background:var(--card)}
.card.on{background:#e6e7df;border-left-color:var(--blue)}
.card.flash{background:#e6e7df}
.card .hd{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.card .nm{font-size:14.5px;font-weight:640;letter-spacing:-.02em}
.card .dist{margin-left:auto;font-size:11.5px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.card .meta{color:var(--muted);font-size:11.5px;margin-top:3px;line-height:1.5}
.card .rate{color:var(--ink);font-size:12px;margin-top:5px;
  font-variant-numeric:tabular-nums}
.card .rate b{font-weight:700;color:var(--blue)}
.card .rate.off{color:var(--muted);font-style:normal}
.card .big{font-size:16px;font-weight:650;color:var(--ochre);
  letter-spacing:-.02em}
.card .hd svg{flex:0 0 auto;vertical-align:-3px;margin-right:2px}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;padding:0 6px;border-radius:2px;
  border:1px solid var(--rule);color:var(--muted)}
.tag.hot{border-color:rgba(140,58,43,.5);color:var(--warn)}
.tag.cap{border-color:rgba(44,74,124,.45);color:var(--blue)}
.tag.est{border-color:rgba(140,58,43,.55);color:var(--warn);font-weight:600}
.tag.brand{border-color:rgba(25,28,24,.35);color:var(--ink)}
details.more{margin-top:7px}
details.more>summary{cursor:pointer;list-style:none;font-size:12px;
  color:var(--blue);padding:2px 0}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"＋ ";font-weight:600}
details.more[open]>summary::before{content:"－ "}
table{width:100%;border-collapse:collapse;margin-top:7px;font-size:11.5px}
th,td{padding:3px 5px;text-align:right;white-space:nowrap}
th{font-weight:550;color:var(--muted);font-size:11px;border-bottom:1px solid var(--rule)}
th:first-child,td:first-child{text-align:left}
tbody tr+tr td{border-top:1px solid rgba(211,213,204,.6)}
td.r-close{color:var(--blue);font-weight:600}
td.r-short{color:var(--warn)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.lk{margin-top:6px;font-size:12px}
.foot{margin:26px 0 36px;font-size:11.5px;color:var(--muted);
  border-top:1px solid var(--rule);padding-top:11px;line-height:1.65}
.spin{color:var(--muted);font-size:13px;padding:8px 0}
.rlist{margin-top:10px}
.rtable{width:100%;font-size:12px;margin-top:8px}
.rtable tr{cursor:pointer}
.rtable tr:hover td{background:var(--card)}
</style>
</head>
<body>
<header>
  <h1>청약·미분양·대장아파트 지도</h1>
  <div class="layers" id="layers">
    <button data-l="cy" class="on" aria-pressed="true"><i class="sw"></i>청약<span class="n" id="n-cy"></span></button>
    <button data-l="un" class="on" aria-pressed="true"><i class="sw"></i>준공후 미분양<span class="n" id="n-un"></span></button>
    <button data-l="dj" class="on" aria-pressed="true"><i class="sw"></i>대장<span class="n" id="n-dj"></span></button>
  </div>
  <div class="src" id="src"></div>
</header>

<div class="wrap">
  <div class="left">
    <div class="tools">
      <div class="search">
        <input id="q" type="search" autocomplete="off"
          placeholder="주소나 건물·지하철역 이름으로 찾기 (예: 판교역, 수원시 영통구 광교로)">
        <div class="sresult" id="sres" hidden></div>
      </div>
      <div class="rad" id="rad" role="group" aria-label="반경">
        <button data-r="0" class="on">지역</button>
        <button data-r="1">1km</button>
        <button data-r="3">3km</button>
        <button data-r="5">5km</button>
        <button data-r="10">10km</button>
      </div>
    </div>
    <div class="crumb" id="crumb"></div>
    <div id="map"></div>
    <div class="legend" id="legend"></div>
  </div>
  <button class="jump" id="jump">정보 보기 ↓</button>
  <div class="right" id="panel">
    <p class="empty">지도를 확대하거나 지역을 누르면 그 지역을 보여줍니다.
      위에서 주소를 찾거나 반경을 고르면 행정구역과 상관없이
      그 지점 주변을 봅니다.</p>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const cache = {sgg:{}, emd:{}, region:{}, dj:{}};
let IDX = null, DJI = null, SIDO = null;
let view = {sido: null, sgg: null, dong: null};
let LAYER = {cy: true, un: true, dj: true};
let MAP = null, ready = false;
let RADIUS = 0;                  // km. 0 이면 행정구역 모드
let CENTER = null;               // {lat, lng, label}
let ITEMS = [];                  // 지금 화면의 단지들 (지도·목록 공용)
let SEL = null;                  // 고른 단지 id

const SLUG = {서울:'seoul',부산:'busan',대구:'daegu',인천:'incheon',
  대전:'daejeon',울산:'ulsan',세종:'sejong',경기:'gyeonggi',강원:'gangwon',
  충북:'chungbuk',충남:'chungnam',전북:'jeonbuk',전남광주:'jngj',
  경북:'gyeongbuk',경남:'gyeongnam',제주:'jeju'};
const SIDO_FULL = {서울:'서울특별시',부산:'부산광역시',대구:'대구광역시',
  인천:'인천광역시',대전:'대전광역시',울산:'울산광역시',세종:'세종특별자치시',
  경기:'경기도',강원:'강원특별자치도',충북:'충청북도',충남:'충청남도',
  전북:'전북특별자치도',전남광주:'전남광주통합특별시',경북:'경상북도',
  경남:'경상남도',제주:'제주특별자치도'};
const sidoFull = (s) => SIDO_FULL[s] || s;
const fmt = (n) => n == null ? '–' : n.toLocaleString('ko-KR');
const ym = (s) => s ? `${s.slice(0, 4)}년 ${+s.slice(4)}월` : '';
const esc = (t) => String(t ?? '').replace(/[&<>"]/g,
  (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function grab(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url} 를 불러오지 못했습니다 (${r.status})`);
  return r.json();
}
const sggGeo = (s) => cache.sgg[s] || (cache.sgg[s] = grab(`geo/sgg/${SLUG[s]}.json`));
const emdGeo = (s) => cache.emd[s] || (cache.emd[s] = grab(`geo/emd/${SLUG[s]}.json`));
const regionOf = (s) => cache.region[s] || (cache.region[s] = grab(`region/${SLUG[s]}.json`));
const djOf = (s) => cache.dj[s] ||
  (cache.dj[s] = grab(`daejang/${SLUG[s]}.json`).catch(() => ({})));

/* ── 거리 ───────────────────────────────── */
function dist(aLat, aLng, bLat, bLng) {
  const R = 6371, d = Math.PI / 180;
  const dLat = (bLat - aLat) * d, dLng = (bLng - aLng) * d;
  const x = Math.sin(dLat / 2) ** 2 +
    Math.cos(aLat * d) * Math.cos(bLat * d) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
const fmtDist = (km) => km < 1 ? `${Math.round(km * 1000)}m` : `${km.toFixed(1)}km`;

/* 반경 원이 걸치는 시도만 골라 받는다. 경계를 넘는 반경 조회의 핵심이다. */
function sidosInRange(lat, lng, km) {
  const dLat = km / 111;
  const dLng = km / (111 * Math.cos(lat * Math.PI / 180));
  const s = lat - dLat, n = lat + dLat, w = lng - dLng, e = lng + dLng;
  return Object.entries(SIDO)
    .filter(([, r]) => r.box && r.box[0] <= n && r.box[2] >= s &&
                       r.box[1] <= e && r.box[3] >= w)
    .map(([k]) => k);
}

/* ── 준공후 미분양 추정 ─────────────────── */
function estIds(R) {
  const after = R && R.unsold && R.unsold.after;
  if (!after) return new Set();
  const d = new Date();
  const now = d.getFullYear() * 100 + (d.getMonth() + 1);
  return new Set((R.notices || []).filter((n) =>
    n.moveIn && +n.moveIn <= now && n.types.some((t) => t.result === '미달'))
    .map((n) => n.id));
}

function djOnes(D) {
  const out = [];
  if (!D) return out;
  if (D.leader) out.push([D.leader, 'leader']);
  if (D.top && (!D.leader || D.top.name !== D.leader.name)) out.push([D.top, 'top']);
  for (const c of D.cand || []) out.push([c, 'cand']);
  return out.filter(([c]) => c && c.loc);
}

/* 한 시군구의 단지들을 공통 형식으로 모은다. */
function itemsOf(sido, sgg, R, D) {
  const out = [];
  const est = estIds(R);
  for (const n of R.notices || []) {
    if (!n.loc) continue;
    const un = est.has(n.id);
    out.push({id: (un ? 'un-' : 'nt-') + n.id, kind: un ? 'un' : 'cy',
      loc: n.loc, name: n.name, sido, sgg, data: n});
  }
  for (const [c, k] of djOnes(D))
    out.push({id: `dj-${sgg}-${c.name}`, kind: 'dj', sub: k,
      loc: c.loc, name: c.name, sido, sgg, data: c});
  return out;
}

async function collect() {
  if (RADIUS && CENTER) {
    const names = sidosInRange(CENTER.lat, CENTER.lng, RADIUS);
    const out = [];
    for (const sd of names) {
      const [R, D] = await Promise.all([regionOf(sd), djOf(sd)]);
      for (const g of Object.keys(R))
        out.push(...itemsOf(sd, g, R[g], D[g]));
    }
    return out.map((it) => Object.assign(it,
        {dist: dist(CENTER.lat, CENTER.lng, it.loc[0], it.loc[1])}))
      .filter((it) => it.dist <= RADIUS)
      .sort((a, b) => a.dist - b.dist);
  }
  if (!view.sido) return [];
  const [R, D] = await Promise.all([regionOf(view.sido), djOf(view.sido)]);
  const gus = view.sgg ? [view.sgg] : Object.keys(R);
  const out = [];
  for (const g of gus) if (R[g]) out.push(...itemsOf(view.sido, g, R[g], D[g]));
  return out;
}


/* ── 핀 그림 ────────────────────────────── */
/* 흔히 쓰는 물방울 모양 위치 핀에 속기호를 넣는다.
   청약은 아파트, 준공후 미분양은 우는 얼굴, 대장은 왕관. */
const PIN_BODY = 'M14 1C7.4 1 2 6.4 2 13c0 9.2 12 24 12 24s12-14.8 12-24C26 6.4 20.6 1 14 1z';
const COLOR = {close: '#2c4a7c', short: '#a8553a', none: '#7e837a',
               un: '#8c3a2b', dj: '#b8860b', cand: '#c9a227'};

function glyph(kind, c) {
  if (kind === 'dj')            // 왕관
    return `<path d="M8.4 18.1 7.1 9.6l4.1 2.9L14 7.8l2.8 4.7 4.1-2.9-1.3 8.5z"
      fill="${c}" stroke="${c}" stroke-width=".7" stroke-linejoin="round"/>`;
  if (kind === 'un')            // 우는 얼굴
    return `<circle cx="11.5" cy="11.3" r="1.2" fill="${c}"/>
      <circle cx="16.5" cy="11.3" r="1.2" fill="${c}"/>
      <path d="M11.6 13.4s-1.5 2-1.5 2.8a1.5 1.5 0 0 0 3 0c0-.8-1.5-2.8-1.5-2.8z"
        fill="${c}"/>
      <path d="M11 18.1q3-2.7 6 0" fill="none" stroke="${c}"
        stroke-width="1.7" stroke-linecap="round"/>`;
  // 아파트 (청약)
  return `<path d="M9.6 19.2V10.9l4.4-2.8 4.4 2.8v8.3z" fill="${c}"/>
    <rect x="11.1" y="12.2" width="1.9" height="1.9" fill="#fff"/>
    <rect x="15" y="12.2" width="1.9" height="1.9" fill="#fff"/>
    <rect x="11.1" y="15.4" width="1.9" height="1.9" fill="#fff"/>
    <rect x="15" y="15.4" width="1.9" height="1.9" fill="#fff"/>`;
}

function pinSvg(kind, tone, w) {
  const c = COLOR[tone] || COLOR.close;
  const h = Math.round(w * 38 / 28);
  return `<svg viewBox="0 0 28 38" width="${w}" height="${h}" aria-hidden="true">
    <path d="${PIN_BODY}" fill="${c}" stroke="#fff" stroke-width="2.2"/>
    <circle cx="14" cy="13" r="8.1" fill="#fff"/>
    ${glyph(kind, c)}</svg>`;
}

/* 단지 하나가 어떤 그림을 쓰는지 */
function pinKind(it) {
  if (it.kind === 'un') return ['un', 'un'];
  if (it.kind === 'dj') return ['dj', it.sub === 'cand' ? 'cand' : 'dj'];
  const n = it.data;
  return ['cy', n.closedTypes ? 'close' : n.ratedTypes ? 'short' : 'none'];
}

/* ── 지도 ───────────────────────────────── */
const KAKAO_KEY = '368b3da5034cf7392bf2390b9f8d1ebe';
const NAT_CENTER = [36.3, 127.8], NAT_LEVEL = 13;
const LV_SGG = 11, LV_EMD = 7;
let polys = [], labels = [], pins = [], circle = null, ctrMark = null;
let autoMoving = false;

function loadSdk() {
  return new Promise((ok, no) => {
    const s = document.createElement('script');
    // services 를 같이 받아야 주소·장소 검색을 쓸 수 있다.
    s.src = `//dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_KEY}` +
            `&autoload=false&libraries=services`;
    s.onload = () => window.kakao.maps.load(ok);
    s.onerror = () => no(new Error('카카오맵 스크립트를 불러오지 못했습니다'));
    document.head.appendChild(s);
  });
}

function clearOverlays() {
  polys.forEach((p) => p.setMap(null));
  labels.forEach((l) => l.setMap(null));
  polys = []; labels = [];
}
function clearPins() {
  pins.forEach((p) => p.ov.setMap(null));
  pins = [];
  for (const k of ['cy', 'un', 'dj']) $('n-' + k).textContent = '';
}
const LL = (a, b) => new kakao.maps.LatLng(a, b);
function bounds(box) {
  const b = new kakao.maps.LatLngBounds();
  b.extend(LL(box[0], box[1])); b.extend(LL(box[2], box[3]));
  return b;
}
function fitTo(box) {
  autoMoving = true;
  MAP.setBounds(bounds(box));
  setTimeout(() => { autoMoving = false; }, 60);
}

/* zIndex 를 못박는다. 시군구 위에 읍면동이 겹쳐 그려지는데,
   순서를 운에 맡기면 안쪽을 눌러도 바깥 경계가 먼저 받는다.

   색은 지도 종류마다 따로 둔다. 일반지도에서 쓰던 어두운 녹회색 선은
   위성사진 위에서 거의 보이지 않는다. 스카이뷰에서는 흰 선과 노란
   선택선을 쓴다. */
const FILL_ROAD = {
  sido: {zIndex: 1, strokeWeight: 2, strokeColor: '#5a6150', strokeOpacity: .85,
         fillColor: '#8a9280', fillOpacity: .10},
  sgg:  {zIndex: 2, strokeWeight: 2, strokeColor: '#4a5142', strokeOpacity: .8,
         fillColor: '#8a9280', fillOpacity: .07},
  sel:  {zIndex: 2, strokeWeight: 3, strokeColor: '#2c4a7c', strokeOpacity: .95,
         fillColor: '#2c4a7c', fillOpacity: .05},
  emd:  {zIndex: 3, strokeWeight: 1, strokeColor: '#191c18', strokeOpacity: .35,
         fillColor: '#2c4a7c', fillOpacity: .02},
  emdSel:{zIndex: 4, strokeWeight: 2.5, strokeColor: '#2c4a7c', strokeOpacity: .95,
         fillColor: '#2c4a7c', fillOpacity: .14},
};
const FILL_SKY = {
  sido: {zIndex: 1, strokeWeight: 2.5, strokeColor: '#ffffff', strokeOpacity: .9,
         fillColor: '#ffffff', fillOpacity: .06},
  sgg:  {zIndex: 2, strokeWeight: 2.5, strokeColor: '#ffffff', strokeOpacity: .8,
         fillColor: '#ffffff', fillOpacity: .04},
  sel:  {zIndex: 2, strokeWeight: 4, strokeColor: '#ffd84d', strokeOpacity: .95,
         fillColor: '#ffd84d', fillOpacity: .07},
  emd:  {zIndex: 3, strokeWeight: 1.4, strokeColor: '#ffffff', strokeOpacity: .5,
         fillColor: '#ffffff', fillOpacity: .01},
  emdSel:{zIndex: 4, strokeWeight: 3, strokeColor: '#ffd84d', strokeOpacity: .95,
         fillColor: '#ffd84d', fillOpacity: .16},
};
let SKY = true;                       // 스카이뷰로 시작한다
const FILL = () => (SKY ? FILL_SKY : FILL_ROAD);

function drawShape(rec, style, onClick, hover) {
  const made = [];
  for (const ring of rec.rings) {
    const poly = new kakao.maps.Polygon(Object.assign(
      {path: ring.map((p) => LL(p[0], p[1]))}, style));
    poly.setMap(MAP);
    if (onClick) kakao.maps.event.addListener(poly, 'click', onClick);
    if (hover) {
      kakao.maps.event.addListener(poly, 'mouseover', () =>
        made.forEach((p) => p.setOptions({fillOpacity: style.fillOpacity + .16})));
      kakao.maps.event.addListener(poly, 'mouseout', () =>
        made.forEach((p) => p.setOptions({fillOpacity: style.fillOpacity})));
    }
    made.push(poly); polys.push(poly);
  }
}

function putLabel(ll, text, small) {
  const el = document.createElement('div');
  el.className = 'plab' + (small ? ' sm' : '');
  el.textContent = text;
  const ov = new kakao.maps.CustomOverlay({position: LL(ll[0], ll[1]),
    content: el, yAnchor: .5, xAnchor: .5, zIndex: 2, clickable: false});
  ov.setMap(MAP); labels.push(ov);
}

async function drawBoundaries() {
  if (!ready) return;
  clearOverlays();
  const lv = MAP.getLevel();
  if (!view.sido || lv > LV_SGG) {
    for (const [name, rec] of Object.entries(SIDO)) {
      drawShape(rec, FILL().sido, () => enterSido(name), true);
      if (rec.label) putLabel(rec.label, name);
    }
    return;
  }
  const sgg = await sggGeo(view.sido);
  const many = Object.keys(sgg).length > 18;
  for (const [name, rec] of Object.entries(sgg)) {
    const on = name === view.sgg;
    drawShape(rec, on ? FILL().sel : FILL().sgg, () => enterSgg(view.sido, name), !on);
    if (rec.label) putLabel(rec.label, name, many);
  }
  if (view.sgg && lv <= LV_EMD) {
    try {
      const emd = (await emdGeo(view.sido))[view.sgg];
      if (emd) for (const [dn, rec] of Object.entries(emd)) {
        drawShape(rec, dn === view.dong ? FILL().emdSel : FILL().emd,
          () => pickDong(dn), dn !== view.dong);
        if (rec.label) putLabel(rec.label, dn, true);
      }
    } catch (e) {}
  }
}

/* 스카이뷰는 둘로 나뉜다. SKYVIEW 는 위성사진만, HYBRID 는 그 위에
   지명·도로 라벨까지 얹은 것이다. 둘 다 '기본 타입' 이어서
   setMapTypeId 로 고른다 (addOverlayMapTypeId 는 교통정보·지적편집도
   같은 겹침 층 전용이라 HYBRID 를 넘기면 아무 일도 하지 않는다).
   카카오맵 본 앱에서 '스카이뷰' 를 고르면 라벨이 같이 나오므로
   우리도 HYBRID 를 쓴다. */
function setSky(on) {
  SKY = on;
  $('map').classList.toggle('sky', on);
}

function applyMapType(on) {
  try {
    MAP.setMapTypeId(on ? kakao.maps.MapTypeId.HYBRID
                        : kakao.maps.MapTypeId.ROADMAP);
  } catch (e) {}
}

/* 지도 종류가 바뀌면 경계 색을 맞춰 다시 그린다.
   카카오 기본 컨트롤의 '스카이뷰' 단추는 라벨 없는 SKYVIEW 를 고르므로,
   그때마다 라벨 있는 HYBRID 로 올려준다. */
function onMapType() {
  let t = null;
  try { t = MAP.getMapTypeId(); } catch (e) { return; }
  const K = kakao.maps.MapTypeId;
  if (t === K.SKYVIEW) { MAP.setMapTypeId(K.HYBRID); return; }
  const sky = (t === K.HYBRID);
  if (sky === SKY) return;            // 바뀐 게 없다
  setSky(sky);
  drawBoundaries();
  drawCircle();
}

/* ── 반경 원 ────────────────────────────── */
function drawCircle() {
  if (circle) { circle.setMap(null); circle = null; }
  if (ctrMark) { ctrMark.setMap(null); ctrMark = null; }
  if (!RADIUS || !CENTER || !ready) return;
  circle = new kakao.maps.Circle({
    center: LL(CENTER.lat, CENTER.lng), radius: RADIUS * 1000,
    strokeWeight: SKY ? 3 : 2, strokeColor: SKY ? '#ffd84d' : '#2c4a7c',
    strokeOpacity: .9, strokeStyle: 'shortdash',
    fillColor: SKY ? '#ffffff' : '#2c4a7c', fillOpacity: SKY ? .04 : .05,
    zIndex: 1});
  circle.setMap(MAP);
  const el = document.createElement('div');
  el.style.cssText = 'width:14px;height:14px;border-radius:50%;background:#2c4a7c;' +
    'border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.5);' +
    'transform:translate(-50%,-50%)';
  el.title = CENTER.label || '기준점';
  ctrMark = new kakao.maps.CustomOverlay({position: LL(CENTER.lat, CENTER.lng),
    content: el, yAnchor: .5, xAnchor: .5, zIndex: 70, clickable: false});
  ctrMark.setMap(MAP);
}

/* ── 단지 점 ────────────────────────────── */
function drawPins() {
  if (!ready) { return; }
  clearPins();
  const counts = {cy: 0, un: 0, dj: 0};
  for (const it of ITEMS) counts[it.kind]++;
  const shown = ITEMS.filter((it) => LAYER[it.kind]);
  // 몇 개 안 될 때만 이름표를 붙이고, 많으면 점도 줄인다.
  // 시도 전체를 볼 때 큰 점 수백 개가 서로 덮어버리기 때문이다.
  // 이름표는 몇 개 안 될 때만. 길면 잘라서 옆 핀을 덜 덮게 한다.
  const withName = shown.length <= 14;
  const small = shown.length > 80;
  for (const it of shown) {
    const [k, tone] = pinKind(it);
    const el = document.createElement('div');
    el.className = 'pin' + (small ? ' sm' : '');
    el.innerHTML = pinSvg(k, tone, small ? 20 : 28) +
      (withName ? `<div class="tag">${esc(it.name.length > 13
        ? it.name.slice(0, 12) + '…' : it.name)}</div>` : '');
    el.title = it.name + (it.dist != null ? ` · ${fmtDist(it.dist)}` : '');
    el.addEventListener('click', (e) => { e.stopPropagation(); select(it.id, false); });
    const ov = new kakao.maps.CustomOverlay({position: LL(it.loc[0], it.loc[1]),
      content: el, yAnchor: 1, xAnchor: .5, zIndex: 10, clickable: true});
    ov.setMap(MAP);
    pins.push({ov, el, id: it.id});
  }
  $('n-cy').textContent = counts.cy ? ` ${counts.cy}` : '';
  $('n-un').textContent = counts.un ? ` ${counts.un}` : '';
  $('n-dj').textContent = counts.dj ? ` ${counts.dj}` : '';
  applySel();
  dimPins();
}

function dimPins() {
  const keep = view.dong && curEmd && curEmd[view.dong] ? new Set(
    ITEMS.filter((it) => inRings(curEmd[view.dong].rings, it.loc[0], it.loc[1]))
      .map((it) => it.id)) : null;
  pins.forEach((p) => p.el.classList.toggle('dim', !!keep && !keep.has(p.id)));
}

function applySel() {
  pins.forEach((p) => p.el.classList.toggle('sel', p.id === SEL));
  document.querySelectorAll('.card').forEach((c) =>
    c.classList.toggle('on', c.id === SEL));
}

/* 카드를 보이게 옮긴다. PC 에서는 오른쪽 칸이 제 스크롤 상자라
   그 안에서 움직이고, 모바일에서는 칸이 길게 펼쳐져 있어 창을 움직인다.
   scrollIntoView 하나로는 모바일에서 듣지 않는 경우가 있다. */
function bringIntoView(el) {
  const box = $('panel');
  const own = getComputedStyle(box).overflowY !== 'visible' &&
              box.scrollHeight > box.clientHeight + 4;
  if (own) { el.scrollIntoView({behavior: 'smooth', block: 'center'}); return; }
  const y = el.getBoundingClientRect().top + window.scrollY - window.innerHeight * .32;
  window.scrollTo({top: Math.max(0, y), behavior: 'smooth'});
  setTimeout(syncJump, 600);
}

/* 지도 ↔ 목록 양방향. fromCard 면 지도를 그 자리로 옮긴다. */
function select(id, fromCard) {
  SEL = SEL === id ? null : id;
  applySel();
  const it = ITEMS.find((x) => x.id === id);
  if (SEL && it) {
    if (fromCard && ready) {
      autoMoving = true;
      MAP.setCenter(LL(it.loc[0], it.loc[1]));
      if (MAP.getLevel() > 5) MAP.setLevel(5);
      setTimeout(() => { autoMoving = false; }, 60);
    }
    const card = document.getElementById(id);
    if (card && !fromCard) {
      bringIntoView(card);
      card.classList.add('flash');
      setTimeout(() => card.classList.remove('flash'), 1200);
    }
  }
}

/* ── 이동 ───────────────────────────────── */
async function refresh() {
  ITEMS = await collect();
  drawPins();
  renderPanel();
}

async function enterSido(name) {
  RADIUS = 0; CENTER = null; syncRad();
  view = {sido: name, sgg: null, dong: null}; SEL = null;
  fitTo(SIDO[name].box);
  crumb(); drawCircle();
  await drawBoundaries();
  await refresh();
}

async function enterSgg(sido, sgg) {
  RADIUS = 0; CENTER = null; syncRad();
  view = {sido, sgg, dong: null}; SEL = null;
  const g = await sggGeo(sido);
  if (g[sgg] && g[sgg].box) fitTo(g[sgg].box);
  try { curEmd = (await emdGeo(sido))[sgg] || null; } catch (e) { curEmd = null; }
  crumb(); drawCircle();
  await drawBoundaries();
  await refresh();
}

async function goNational() {
  RADIUS = 0; CENTER = null; syncRad();
  view = {sido: null, sgg: null, dong: null}; SEL = null; ITEMS = [];
  autoMoving = true;
  MAP.setCenter(LL(NAT_CENTER[0], NAT_CENTER[1]));
  MAP.setLevel(NAT_LEVEL);
  setTimeout(() => { autoMoving = false; }, 60);
  crumb(); clearPins(); drawCircle();
  await drawBoundaries();
  renderPanel();
}

function pickDong(name) {
  view.dong = view.dong === name ? null : name;
  drawBoundaries(); dimPins(); renderPanel();
}

/* ── 반경 모드 ──────────────────────────── */
function syncRad() {
  document.querySelectorAll('#rad button').forEach((b) =>
    b.classList.toggle('on', +b.dataset.r === RADIUS));
}

async function setRadius(km, center) {
  RADIUS = km; syncRad();
  if (!km) {                       // '지역' 으로 돌아간다
    CENTER = null; SEL = null; drawCircle();
    if (view.sgg) return enterSgg(view.sido, view.sgg);
    if (view.sido) return enterSido(view.sido);
    return goNational();
  }
  if (center) CENTER = center;
  if (!CENTER) {
    const c = MAP ? MAP.getCenter() : null;
    CENTER = c ? {lat: c.getLat(), lng: c.getLng(), label: '지도 가운데'}
               : {lat: NAT_CENTER[0], lng: NAT_CENTER[1], label: '지도 가운데'};
  }
  SEL = null;
  if (ready) {
    autoMoving = true;
    MAP.setCenter(LL(CENTER.lat, CENTER.lng));
    // 반경이 화면에 들어오게 배율을 맞춘다
    MAP.setLevel(km <= 1 ? 5 : km <= 3 ? 6 : km <= 5 ? 7 : 8);
    setTimeout(() => { autoMoving = false; }, 60);
    // 반경 안이 어느 시도인지 알아야 경계도 맞춰 그린다
    const hit = whichSido(CENTER.lat, CENTER.lng);
    if (hit) view = {sido: hit, sgg: null, dong: null};
    drawCircle();
    await drawBoundaries();
  }
  crumb();
  await refresh();
}

function crumb() {
  const c = [];
  if (RADIUS && CENTER) {
    c.push('<button id="c-nat">전국</button>');
    c.push(`<b>${esc(CENTER.label || '기준점')}</b>`);
    c.push(`<span>반경 ${RADIUS}km</span>`);
  } else if (!view.sido) {
    c.push('<b>전국</b><span>지역을 누르거나 확대하세요</span>');
  } else {
    c.push('<button id="c-nat">전국</button>');
    if (view.sgg) {
      c.push(`<button id="c-sido">${sidoFull(view.sido)}</button>`);
      c.push(`<b>${view.sgg}</b>`);
      if (view.dong) c.push(`<b>${view.dong}</b>`);
    } else {
      c.push(`<b>${sidoFull(view.sido)}</b><span>시·군·구를 고르세요</span>`);
    }
  }
  $('crumb').innerHTML = c.join('');
  if ($('c-nat')) $('c-nat').onclick = goNational;
  if ($('c-sido')) $('c-sido').onclick = () => enterSido(view.sido);
}

let idleTimer = null, curEmd = null;
function onIdle() {
  if (autoMoving || RADIUS) return;     // 반경 모드에서는 자동 전환하지 않는다
  clearTimeout(idleTimer);
  idleTimer = setTimeout(async () => {
    const lv = MAP.getLevel(), c = MAP.getCenter();
    if (lv > LV_SGG && view.sido) {
      view = {sido: null, sgg: null, dong: null}; ITEMS = [];
      crumb(); clearPins(); await drawBoundaries(); renderPanel(); return;
    }
    if (lv <= LV_SGG && !view.sido) {
      const hit = whichSido(c.getLat(), c.getLng());
      if (hit) return enterSidoQuiet(hit);
    }
    if (lv <= LV_EMD && view.sido && !view.sgg) {
      const g = await sggGeo(view.sido);
      const hit = Object.keys(g).find((k) => inRings(g[k].rings, c.getLat(), c.getLng()));
      if (hit) return enterSggQuiet(view.sido, hit);
    }
    await drawBoundaries();
  }, 180);
}
/* 확대로 들어갈 때는 지도를 다시 움직이지 않는다 (사용자가 보던 자리 유지) */
async function enterSidoQuiet(name) {
  view = {sido: name, sgg: null, dong: null};
  crumb(); await drawBoundaries(); await refresh();
}
async function enterSggQuiet(sido, sgg) {
  view = {sido, sgg, dong: null};
  try { curEmd = (await emdGeo(sido))[sgg] || null; } catch (e) { curEmd = null; }
  crumb(); await drawBoundaries(); await refresh();
}

function inRings(rings, lat, lng) {
  let hit = false;
  for (const ring of rings) {
    let c = false;
    for (let i = 0; i < ring.length - 1; i++) {
      const y1 = ring[i][0], x1 = ring[i][1];
      const y2 = ring[i + 1][0], x2 = ring[i + 1][1];
      if ((y1 > lat) !== (y2 > lat)) {
        const xx = x1 + (lat - y1) * (x2 - x1) / (y2 - y1);
        if (lng < xx) c = !c;
      }
    }
    if (c) hit = !hit;
  }
  return hit;
}
function whichSido(lat, lng) {
  for (const [name, rec] of Object.entries(SIDO))
    if (inRings(rec.rings, lat, lng)) return name;
  return null;
}

/* ── 검색 ───────────────────────────────── */
let searchTimer = null;
function hideRes() { $('sres').hidden = true; $('sres').innerHTML = ''; }

function showRes(list) {
  const box = $('sres');
  if (!list.length) {
    box.innerHTML = '<div class="none">찾은 곳이 없습니다.</div>';
    box.hidden = false; return;
  }
  box.innerHTML = list.slice(0, 12).map((r, i) =>
    `<button data-i="${i}"><div class="nm">${esc(r.name)}</div>
     <div class="ad">${esc(r.addr)}</div></button>`).join('');
  box.hidden = false;
  box.querySelectorAll('button').forEach((b) => b.onclick = () => {
    const r = list[+b.dataset.i];
    hideRes();
    $('q').value = r.name;
    setRadius(RADIUS || 5, {lat: r.lat, lng: r.lng, label: r.name});
  });
}

function doSearch(q) {
  if (!q.trim()) { hideRes(); return; }
  if (!ready || !window.kakao || !kakao.maps.services) {
    showRes([]); return;
  }
  const geo = new kakao.maps.services.Geocoder();
  geo.addressSearch(q, (res, st) => {
    const ok = st === kakao.maps.services.Status.OK;
    const hits = ok ? res.map((r) => ({
      name: r.road_address ? r.road_address.address_name : r.address_name,
      addr: r.address ? r.address.address_name : '',
      lat: +r.y, lng: +r.x})) : [];
    if (hits.length) { showRes(hits); return; }
    // 주소로 안 나오면 건물·역 이름으로 다시 찾는다
    const ps = new kakao.maps.services.Places();
    ps.keywordSearch(q, (pres, pst) => {
      const pok = pst === kakao.maps.services.Status.OK;
      showRes(pok ? pres.map((r) => ({
        name: r.place_name,
        addr: r.road_address_name || r.address_name || '',
        lat: +r.y, lng: +r.x})) : []);
    });
  });
}

$('q').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  const v = e.target.value;
  searchTimer = setTimeout(() => doSearch(v), 320);
});
$('q').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') hideRes();
  if (e.key === 'Enter') { clearTimeout(searchTimer); doSearch(e.target.value); }
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.search')) hideRes();
});
$('rad').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-r]');
  if (b) setRadius(+b.dataset.r);
});

/* ── 오른쪽 정보 ───────────────────────── */
function figs(list) {
  return `<div class="figs">` + list.map(([k, v, u, c, note]) =>
    `<div class="fig ${c || ''}"><div class="k">${k}</div>
     <div class="v num">${v}${u ? `<span class="u">${u}</span>` : ''}</div>
     ${note ? `<div class="note">${note}</div>` : ''}</div>`).join('') + `</div>`;
}

function renderPanel() {
  if (RADIUS && CENTER) return renderRadius();
  if (view.sgg) return renderSgg();
  if (view.sido) return renderSido();
  return renderNational();
}

function bindCards() {
  $('panel').querySelectorAll('.card').forEach((c) => {
    c.onclick = (e) => {
      if (e.target.closest('a,table,summary,button')) return;
      select(c.id, true);
    };
  });
  $('panel').querySelectorAll('tr[data-go]').forEach((tr) =>
    tr.onclick = () => select(tr.dataset.go, true));
  applySel();
}

function sections(items, ctx) {
  let h = '';
  const by = (k) => items.filter((x) => x.kind === k);
  if (LAYER.un) {
    const u = by('un');
    h += `<h3>${pinSvg('un','un',15)}준공후 미분양<span>추정 ${u.length}곳</span></h3>`;
    h += u.length ? u.map(noticeCard).join('')
      : `<p class="empty">${ctx.afterNote || '해당 없음'}</p>`;
  }
  if (LAYER.dj) {
    const d = by('dj');
    h += `<h3>${pinSvg('dj','dj',15)}대장아파트<span>${d.length}곳</span></h3>`;
    h += d.length ? d.map(djCard).join('')
      : '<p class="empty">이 범위에서는 대장 판정 자료가 없습니다.</p>';
  }
  if (LAYER.cy) {
    const c = by('cy');
    h += `<h3>${pinSvg('cy','close',15)}청약 공고<span>최근 3년 ${c.length}건</span></h3>`;
    h += c.length ? c.map(noticeCard).join('')
      : '<p class="empty">최근 3년 공고가 없습니다.</p>';
  }
  return h;
}

function foot() {
  const M = IDX.meta;
  return `<div class="foot">청약 한국부동산원 청약홈, 미분양 국토교통부
    (KOSIS) ${ym(M.unsoldBaseYm)} 기준, 시세·대장은 국토교통부 아파트 매매
    실거래 최근 12개월 공급면적 평당가입니다.
    <b>준공후 미분양 단지는 추정입니다.</b> 전국 단지별 공식 자료가 없어,
    입주예정월이 지났고 청약에서 미달 타입이 있었으며 그 시·군·구의 준공후
    미분양이 0호가 아닌 공고를 골라낸 것입니다. 실제와 다를 수 있습니다.
    경쟁률은 마감된 주택형에만 숫자가 붙습니다. 미달은 지원이 공급보다
    적었다는 뜻이라 배수가 없고, 대신 접수 건수를 보여줍니다. 카드의
    경쟁률은 주택형별 최저~최고 범위이며, 주택형을 펴면 어느 순위·지역에서
    마감됐는지까지 나옵니다.
    자료 생성 ${M.generated}.</div>`;
}

function renderNational() {
  const M = IDX.meta;
  const rows = Object.entries(IDX.sidoSummary).sort((a, b) => b[1].total - a[1].total);
  const sum = (f) => rows.reduce((a, [, v]) => a + (v[f] || 0), 0);
  $('panel').innerHTML = `<h2 class="place">전국</h2>
    <div class="place-sub">지역을 누르거나 위에서 주소를 찾으세요</div>` +
    figs([
      ['미분양', fmt(sum('total')), '호', 'ochre', ym(M.unsoldBaseYm) + ' 기준'],
      ['준공 후', fmt(sum('after')), '호', 'ochre', ''],
      ['청약 공고', fmt(sum('notices')), '건', '', '최근 3년'],
      ['공급 세대', fmt(sum('supply')), '세대', '', ''],
    ]) +
    `<table class="rtable"><thead><tr><th>시·도</th><th>미분양</th>
      <th>준공 후</th><th>공고</th></tr></thead><tbody>` +
    rows.map(([s, v]) => `<tr data-s="${s}" style="cursor:pointer">
      <td><b>${sidoFull(s)}</b></td><td class="num">${fmt(v.total)}</td>
      <td class="num">${fmt(v.after)}</td><td class="num">${fmt(v.notices)}</td></tr>`).join('') +
    `</tbody></table>` + foot();
  $('panel').querySelectorAll('tr[data-s]').forEach((tr) =>
    tr.onclick = () => enterSido(tr.dataset.s));
}

function renderSido() {
  const sido = view.sido;
  const v = IDX.sidoSummary[sido] || {};
  const dj = (DJI && DJI.sidoSummary && DJI.sidoSummary[sido]) || null;
  const djSum = (DJI && DJI.summary) || {};
  const rows = Object.entries(IDX.summary)
    .filter(([k]) => k.split('|')[0] === sido)
    .map(([k, s]) => [k.split('|')[1], s])
    .sort((a, b) => b[1].unsold - a[1].unsold);
  $('panel').innerHTML = `<h2 class="place">${sidoFull(sido)}</h2>
    <div class="place-sub">시·군·구를 고르면 단지까지 나옵니다</div>` +
    figs([
      ['미분양', fmt(v.total), '호', 'ochre', ym(IDX.meta.unsoldBaseYm) + ' 기준'],
      ['준공 후', fmt(v.after), '호', 'ochre', ''],
      ['청약 공고', fmt(v.notices), '건', '', '최근 3년'],
      ['평균 시세', dj && dj.avg ? fmt(dj.avg) : '–', '만원/평', '',
        dj && dj.lead ? `대장 ${esc(dj.lead.name)}` : ''],
    ]) +
    `<table class="rtable"><thead><tr><th>시·군·구</th><th>미분양</th>
      <th>준공 후</th><th>시세</th></tr></thead><tbody>` +
    rows.map(([g, s]) => {
      const d = djSum[`${sido}|${g}`];
      return `<tr data-g="${esc(g)}" style="cursor:pointer"><td><b>${g}</b></td>
        <td class="num">${fmt(s.unsold)}</td><td class="num">${fmt(s.after)}</td>
        <td class="num">${d && d.avg ? fmt(d.avg) : '–'}</td></tr>`;
    }).join('') + `</tbody></table>` + foot();
  $('panel').querySelectorAll('tr[data-g]').forEach((tr) =>
    tr.onclick = () => enterSgg(sido, tr.dataset.g));
}

function renderSgg() {
  const {sido, sgg} = view;
  let items = ITEMS;
  if (view.dong && curEmd && curEmd[view.dong])
    items = items.filter((it) => inRings(curEmd[view.dong].rings, it.loc[0], it.loc[1]));
  const S = IDX.summary[`${sido}|${sgg}`] || {};
  const dj = (DJI && DJI.summary && DJI.summary[`${sido}|${sgg}`]) || null;
  const un = items.filter((x) => x.kind === 'un').length;
  $('panel').innerHTML = `<h2 class="place">${sgg}</h2>
    <div class="place-sub">${sidoFull(sido)}${
      view.dong ? ` · ${view.dong}만 보는 중` : ''}</div>` +
    figs([
      ['미분양', fmt(S.unsold), '호', 'ochre', ym(IDX.meta.unsoldBaseYm) + ' 기준'],
      ['준공 후', fmt(S.after), '호', 'ochre', un ? `추정 ${un}곳` : ''],
      ['평균 분양가', S.pyeong ? fmt(S.pyeong) : '–', '만원/평', '', ''],
      ['평균 시세', dj && dj.avg ? fmt(dj.avg) : '–', '만원/평', '', ''],
    ]) +
    sections(items, {afterNote: S.after
      ? '이 시·군·구에 준공후 미분양이 집계되지만 최근 3년 공고 중 짚이는 단지가 없습니다.'
      : `${ym(IDX.meta.unsoldAfterBaseYm)} 기준 0호입니다.`}) + foot();
  bindCards();
}

function renderRadius() {
  const items = ITEMS;
  const un = items.filter((x) => x.kind === 'un').length;
  const cy = items.filter((x) => x.kind === 'cy').length;
  const dj = items.filter((x) => x.kind === 'dj').length;
  const gus = [...new Set(items.map((x) => `${x.sido} ${x.sgg}`))];
  const ppy = items.filter((x) => x.kind === 'cy' && x.data.avgPyeong)
    .map((x) => x.data.avgPyeong);
  const avg = ppy.length ? Math.round(ppy.reduce((a, b) => a + b, 0) / ppy.length) : null;
  $('panel').innerHTML = `<h2 class="place">${esc(CENTER.label || '기준점')}</h2>
    <div class="place-sub">반경 ${RADIUS}km · ${
      gus.length ? esc(gus.slice(0, 3).join(', ')) +
        (gus.length > 3 ? ` 외 ${gus.length - 3}곳` : '') : '해당 지역 없음'}</div>` +
    figs([
      ['청약 공고', fmt(cy), '건', '', '최근 3년'],
      ['준공후 미분양', fmt(un), '곳', 'ochre', '추정'],
      ['대장·최고가', fmt(dj), '곳', '', ''],
      ['평균 분양가', avg ? fmt(avg) : '–', '만원/평', '', '반경 안 공고 평균'],
    ]) +
    sections(items, {afterNote: '이 반경 안에는 짚이는 단지가 없습니다.'}) + foot();
  bindCards();
}

/* ── 카드 ───────────────────────────────── */
function distTag(it) {
  return it.dist != null ? `<span class="dist num">${fmtDist(it.dist)}</span>` : '';
}

function noticeCard(it) {
  const n = it.data;
  const [gk, gt] = pinKind(it);
  const tags = [];
  if (it.kind === 'un') tags.push('<span class="tag est">준공후 미분양 추정</span>');
  if (n.kind) tags.push(`<span class="tag">${esc(n.kind)}</span>`);
  if (n.speculative) tags.push('<span class="tag hot">투기과열</span>');
  if (n.priceCap) tags.push('<span class="tag cap">상한제</span>');
  const meta = [n.noticeDate, n.totalHshld ? `${fmt(n.totalHshld)}세대` : null,
    n.moveIn ? `${n.moveIn.slice(0, 4)}.${n.moveIn.slice(4)} 입주` : null,
    n.avgPyeong ? `${fmt(n.avgPyeong)}만원/평` : null].filter(Boolean).join(' · ');

  /* 청약 결과 요약. 접히기 전에도 경쟁률이 보여야 한다.
     경쟁률 숫자는 마감된 타입에만 붙는다. 미달은 지원이 공급보다 적었다는
     뜻이라 배수가 없어서, 그런 공고는 접수 건수로 보여준다.
     평균은 내지 않는다. 청약홈이 쓰는 분모(해당 순위·지역 배정 물량)가
     자료에 없어서 직접 계산하면 공표된 경쟁률과 어긋난다. 대신 주택형들의
     최저~최고 범위를 그대로 보여준다. */
  const rated = n.types.filter((t) => t.result === '마감' || t.result === '미달');
  const rates = n.types.map((t) => t.rate).filter((x) => x);
  const req = rated.reduce((a, t) => a + (t.req || 0), 0);
  const bits = [];
  if (rates.length) {
    const lo = Math.min(...rates), hi = Math.max(...rates);
    bits.push(`경쟁률 <b>${lo === hi ? hi : `${lo}~${hi}`}:1</b>`);
  }
  if (req) bits.push(`접수 ${fmt(req)}건`);
  if (rated.length) bits.push(`마감 ${n.closedTypes}/${rated.length}타입`);
  const summary = bits.length
    ? `<div class="meta rate">${bits.join(' · ')}</div>`
    : `<div class="meta rate off">청약 결과가 아직 공표되지 않았습니다</div>`;

  const rows = n.types.map((t) => {
    const cls = t.result === '마감' ? 'r-close' : t.result === '미달' ? 'r-short' : '';
    const res = t.result === '마감'
      ? `${esc(t.closedAt || '')} ${t.rate}:1`
      : t.result === '미달' ? '미달' : '미공개';
    return `<tr><td>${esc(t.ty)}</td><td class="num">${t.area ?? '–'}</td>
      <td class="num">${fmt(t.gnrl)}</td>
      <td class="num">${t.result === '결과없음' ? '–' : fmt(t.req)}</td>
      <td class="num">${t.amount ? fmt(t.amount) : '–'}</td>
      <td class="num">${t.pyeong ? fmt(t.pyeong) : '–'}</td>
      <td class="${cls}">${res}</td></tr>`;
  }).join('');

  return `<div class="card" id="${it.id}">
    <div class="hd"><span class="nm">${pinSvg(gk, gt, 15)} ${esc(n.name)}</span>
      ${distTag(it)}</div>
    <div class="meta">${esc(meta)}</div>
    <div class="meta">${esc(it.sgg)} · ${esc(n.addr || '')}</div>
    ${summary}
    <div class="tags">${tags.join('')}</div>
    <details class="more"><summary>주택형별 경쟁률 ${n.types.length}개</summary>
      <div class="tw"><table><thead><tr><th>주택형</th><th>면적</th>
        <th>일반</th><th>접수</th><th>분양가</th><th>평당</th><th>청약 결과</th>
        </tr></thead><tbody>${rows}</tbody></table></div>
      <div class="lk">${n.url ? `<a href="${esc(n.url)}" target="_blank"
        rel="noopener">청약홈 공고</a>` : ''}</div>
    </details></div>`;
}

function djCard(it) {
  const c = it.data, s = c.silv || c;
  const title = it.sub === 'leader' ? '대장' : it.sub === 'cand' ? '대장후보' : '최고가';
  const tags = [];
  if (c.brand) tags.push(`<span class="tag brand">${esc(c.brand)}</span>`);
  if (c.hh) tags.push(`<span class="tag">${fmt(c.hh)}세대</span>`);
  if (c.by) tags.push(`<span class="tag">${c.by}년</span>`);
  if (it.sub === 'cand') tags.push(`<span class="tag est">${esc(c.status || '분양권')}</span>`);
  return `<div class="card" id="${it.id}">
    <div class="hd"><span class="nm">${pinSvg('dj',
      it.sub === 'cand' ? 'cand' : 'dj', 15)} ${esc(c.name)}</span>
      ${distTag(it)}</div>
    <div class="meta">${title} · ${esc(it.sgg)} ${esc(c.dong || '')}
      ${esc(c.road || c.jibun || '')}</div>
    <div class="big num" style="margin-top:4px">${s.ppy ? fmt(s.ppy) : '–'}
      <span style="font-size:11.5px;font-weight:450;color:var(--muted)">만원/평</span>
      ${s.p84 ? `<span style="font-size:12px;font-weight:450;color:var(--muted)">
        · 84㎡ ${fmt(s.p84)}만원</span>` : ''}</div>
    <div class="tags">${tags.join('')}</div>
    ${s.last ? `<div class="meta">최근 ${s.last.d} · ${fmt(s.last.amt)}만원
      · ${s.last.ar}㎡</div>` : ''}</div>`;
}

/* ── 레이어 ─────────────────────────────── */
$('layers').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-l]');
  if (!b) return;
  const k = b.dataset.l;
  LAYER[k] = !LAYER[k];
  b.classList.toggle('on', LAYER[k]);
  b.setAttribute('aria-pressed', String(LAYER[k]));
  drawPins(); renderPanel(); legend();
});

function legend() {
  const ic = (k, t) => pinSvg(k, t, 17);
  const p = [];
  if (LAYER.cy) p.push(`<span>${ic('cy','close')}마감 포함</span>
    <span>${ic('cy','short')}전 타입 미달</span>
    <span>${ic('cy','none')}결과 미공개</span>`);
  if (LAYER.un) p.push(`<span>${ic('un','un')}준공후 미분양 추정</span>`);
  if (LAYER.dj) p.push(`<span>${ic('dj','dj')}대장·최고가</span>
    <span>${ic('dj','cand')}대장후보</span>`);
  p.push('<span style="color:var(--muted)">핀을 누르면 정보로, 정보를 누르면 지도로 갑니다</span>');
  $('legend').innerHTML = p.join('');
}

/* ── 모바일: 지도 ↔ 정보 오가기 ────────────── */
const jump = $('jump');
function syncJump() {
  const top = $('panel').getBoundingClientRect().top;
  const down = top > window.innerHeight * .5;
  jump.textContent = down ? '정보 보기 ↓' : '지도 보기 ↑';
  jump.dataset.dir = down ? 'down' : 'up';
}
jump.addEventListener('click', () => {
  const el = jump.dataset.dir === 'up' ? document.querySelector('.left') : $('panel');
  const y = el.getBoundingClientRect().top + window.scrollY - 6;
  window.scrollTo({top: Math.max(0, y), behavior: 'smooth'});
  // 부드러운 이동이 끝난 뒤 글자를 한 번 더 맞춘다
  setTimeout(syncJump, 600);
});
window.addEventListener('scroll', syncJump, {passive: true});
window.addEventListener('resize', syncJump);
syncJump();

/* ── 시작 ───────────────────────────────── */
(async function () {
  try {
    [IDX, SIDO] = await Promise.all([grab('index.json'), grab('geo/sido.json')]);
    try { DJI = await grab('daejang/index.json'); } catch (e) { DJI = null; }
    $('src').innerHTML = `미분양 ${ym(IDX.meta.unsoldBaseYm)} 기준 · 공고
      ${fmt(IDX.meta.noticeCount)}건${DJI ? ` · 실거래 ${fmt(DJI.meta.trades)}건` : ''}`;
  } catch (e) {
    $('panel').innerHTML = `<p class="empty">자료를 불러오지 못했습니다.
      ${esc(e.message)}</p>`;
    return;
  }
  legend(); renderNational();
  try {
    await loadSdk();
    MAP = new kakao.maps.Map($('map'), {
      center: LL(NAT_CENTER[0], NAT_CENTER[1]), level: NAT_LEVEL,
      mapTypeId: kakao.maps.MapTypeId.HYBRID});
    setSky(true);
    try {
      MAP.addControl(new kakao.maps.MapTypeControl(),
        kakao.maps.ControlPosition.TOPRIGHT);
    } catch (e) {}
    MAP.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
    ready = true;
    kakao.maps.event.addListener(MAP, 'idle', onIdle);
    kakao.maps.event.addListener(MAP, 'maptypeid_changed', onMapType);
    // 지도를 누르면 그 자리를 기준점으로 삼는다 (반경 모드일 때)
    kakao.maps.event.addListener(MAP, 'click', (e) => {
      if (!RADIUS) return;
      const ll = e.latLng;
      setRadius(RADIUS, {lat: ll.getLat(), lng: ll.getLng(), label: '지도에서 고른 지점'});
    });
    crumb();
    await drawBoundaries();
  } catch (e) {
    $('map').innerHTML = `<div class="maperr">지도를 불러오지 못했습니다.
      ${esc(e.message)}<br><br>카카오 개발자 사이트에서
      <b>플랫폼 &gt; Web</b> 에 <code>${esc(location.origin)}</code> 이
      등록돼 있는지, <b>카카오맵</b> 제품이 켜져 있는지 확인해 주세요.</div>`;
  }
})();
</script>
</body>
</html>
