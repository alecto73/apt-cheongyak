<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eeefea">
<title>청약·미분양·대장아파트 지도</title>
<style>
:root{
  --paper:#eeefea; --card:#f7f7f4; --ink:#191c18; --rule:#d3d5cc;
  --muted:#6e7269; --blue:#2c4a7c; --ochre:#8a5a12; --warn:#8c3a2b;
  --gold:#b8860b;
  --pad:clamp(14px,2.4vw,28px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
    "Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  font-size:15px; line-height:1.55; -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--blue);text-decoration:none;border-bottom:1px solid rgba(44,74,124,.35)}
a:hover{border-bottom-color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ── 머리말 ─────────────────────────────── */
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;
  padding:14px var(--pad) 12px;border-bottom:1px solid var(--rule)}
header h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.02em}
header .src{margin-left:auto;font-size:12px;color:var(--muted);line-height:1.4;
  text-align:right}

/* 레이어 토글 */
.layers{display:flex;gap:7px;flex-wrap:wrap}
.layers button{display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--rule);border-radius:999px;padding:4px 12px 4px 9px;
  font-size:13px;color:var(--muted);background:var(--card)}
.layers button .sw{width:11px;height:11px;border-radius:50%;flex:0 0 auto;
  background:var(--muted);opacity:.35}
.layers button.on{color:var(--ink);border-color:var(--ink);font-weight:600}
.layers button.on .sw{opacity:1}
.layers button[data-l="cy"].on .sw{background:var(--blue)}
.layers button[data-l="un"].on .sw{background:var(--warn)}
.layers button[data-l="dj"].on .sw{background:var(--gold)}
.layers button .n{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ── 레이아웃 ───────────────────────────── */
.wrap{display:grid;grid-template-columns:minmax(380px,46%) 1fr;align-items:start}
.left{padding:var(--pad);border-right:1px solid var(--rule);
  position:sticky;top:0;max-height:100vh;overflow:auto}
.right{padding:var(--pad);min-width:0}
@media(max-width:900px){
  .wrap{grid-template-columns:1fr}
  .left{position:static;max-height:none;border-right:0;
    border-bottom:1px solid var(--rule)}
}

/* ── 지도 ───────────────────────────────── */
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:10px;
  font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.crumb b{color:var(--ink);font-weight:600}
.crumb button{border:1px solid var(--rule);border-radius:3px;
  padding:3px 9px;font-size:12.5px;background:var(--card)}
.crumb button:hover{border-color:var(--ink)}
#map{width:100%;height:clamp(380px,66vh,760px);background:var(--card);
  border:1px solid var(--rule)}
.maperr{padding:18px;color:var(--muted);font-size:13.5px;line-height:1.7}

/* 경계 위에 얹는 이름표 */
.plab{font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;
  text-shadow:0 0 3px var(--paper),0 0 3px var(--paper),0 0 3px var(--paper);
  pointer-events:none;transform:translate(-50%,-50%)}
.plab.sm{font-size:11px;font-weight:500;color:var(--muted)}

/* 단지 표시 */
.pin{width:13px;height:13px;border-radius:50%;border:2px solid var(--paper);
  box-shadow:0 0 0 .5px rgba(25,28,24,.35);cursor:pointer;
  transform:translate(-50%,-50%)}
.pin.cy-close{background:var(--blue)}
.pin.cy-short{background:var(--warn)}
.pin.cy-none{background:var(--muted)}
.pin.un{background:#fff;border-color:var(--warn);border-width:3px;
  width:14px;height:14px}
.pin.dj{background:var(--gold);width:14px;height:14px;border-radius:2px;
  transform:translate(-50%,-50%) rotate(45deg)}
.pin.dj.cand{background:#fff;border-color:var(--gold);border-width:3px}
.pin.dim{opacity:.2}
.pin:hover{box-shadow:0 0 0 2px var(--ink)}

.legend{margin-top:12px;font-size:12.5px;color:var(--muted);line-height:1.9}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;
  vertical-align:0;margin-right:5px;border:1.5px solid var(--paper);
  box-shadow:0 0 0 .5px rgba(25,28,24,.3)}
.legend i.un{background:#fff;border-color:var(--warn);border-width:2.5px}
.legend i.dj{background:var(--gold);border-radius:1px}
.legend span{margin-right:12px;white-space:nowrap;display:inline-block}

/* ── 결과 ───────────────────────────────── */
.empty{color:var(--muted);max-width:34em;padding-top:6px}
h2.place{margin:0 0 2px;font-size:clamp(24px,3.6vw,34px);
  font-weight:680;letter-spacing:-.035em;line-height:1.1}
.place-sub{color:var(--muted);font-size:13.5px;margin-bottom:20px}
.figs{display:grid;grid-template-columns:repeat(3,1fr);
  border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}
.fig{padding:11px 13px 12px;border-right:1px solid var(--rule)}
.fig:nth-child(3n),.fig:last-child{border-right:0}
.fig:nth-child(n+4){border-top:1px solid var(--rule)}
@media(max-width:520px){
  .figs{grid-template-columns:repeat(2,1fr)}
  .fig:nth-child(3n){border-right:1px solid var(--rule)}
  .fig:nth-child(2n){border-right:0}
  .fig:nth-child(n+3){border-top:1px solid var(--rule)}
}
.fig .k{font-size:12.5px;color:var(--muted);margin-bottom:3px}
.fig .v{font-size:24px;font-weight:650;letter-spacing:-.03em;line-height:1.15}
.fig .u{font-size:13px;font-weight:450;color:var(--muted);margin-left:2px}
.fig.ochre .v{color:var(--ochre)}
.fig .note{font-size:12px;color:var(--muted);margin-top:2px}

h3{font-size:14px;font-weight:640;margin:28px 0 0;
  padding-bottom:7px;border-bottom:1px solid var(--rule);
  display:flex;align-items:baseline;gap:8px}
h3 span{font-weight:400;color:var(--muted);font-size:12.5px}
h3 .sw{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
h3 .sw.cy{background:var(--blue)}
h3 .sw.un{background:#fff;border:2.5px solid var(--warn)}
h3 .sw.dj{background:var(--gold);border-radius:1px}

.yr{margin-top:8px}
.yr>summary{cursor:pointer;list-style:none;padding:9px 0;
  border-bottom:1px solid var(--rule);display:flex;gap:10px;
  align-items:baseline;font-size:13.5px}
.yr>summary::-webkit-details-marker{display:none}
.yr>summary::before{content:"+";width:14px;color:var(--muted);font-weight:600}
.yr[open]>summary::before{content:"–"}
.yr>summary b{font-size:15px;font-weight:620}
.yr>summary i{margin-left:auto;color:var(--muted);font-style:normal;font-size:12.5px}

.nt{padding:14px 0 16px;border-bottom:1px solid var(--rule);
  scroll-margin-top:14px;transition:background .3s}
.nt.flash,.lead.flash{background:#e6e7df}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;
  vertical-align:1px;margin-right:5px}
.dot.close{background:var(--blue)}
.dot.short{background:var(--warn)}
.dot.none{background:var(--muted)}
.nt-hd{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.nt-hd .nm{font-size:16px;font-weight:620;letter-spacing:-.02em}
.nt-hd .dt{color:var(--muted);font-size:12.5px}
.nt-meta{color:var(--muted);font-size:12.5px;margin-top:3px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:11.5px;padding:1px 7px;border-radius:2px;
  border:1px solid var(--rule);color:var(--muted)}
.tag.hot{border-color:rgba(140,58,43,.5);color:var(--warn)}
.tag.cap{border-color:rgba(44,74,124,.45);color:var(--blue)}
.tag.brand{border-color:rgba(25,28,24,.35);color:var(--ink)}
.tag.est{border-color:rgba(140,58,43,.5);color:var(--warn)}

table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th,td{padding:5px 8px;text-align:right;white-space:nowrap}
th{font-weight:550;color:var(--muted);font-size:12px;border-bottom:1px solid var(--rule)}
th:first-child,td:first-child{text-align:left}
tbody tr+tr td{border-top:1px solid rgba(211,213,204,.6)}
td.r-close{color:var(--blue);font-weight:600}
td.r-short{color:var(--warn)}
td.r-none{color:var(--muted)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.lk{margin-top:9px;font-size:13px}
.foot{margin:32px 0 40px;font-size:12px;color:var(--muted);
  border-top:1px solid var(--rule);padding-top:12px;max-width:60em}
.spin{color:var(--muted);font-size:13.5px;padding:8px 0}

/* 대장 카드 */
.lead{margin-top:12px;padding:14px 16px 13px;background:var(--card);
  border:1px solid var(--rule);border-left:3px solid var(--gold);
  border-radius:3px;scroll-margin-top:14px;transition:background .3s}
.lead .nm{font-size:18px;font-weight:680;letter-spacing:-.03em}
.lead .kv{display:grid;grid-template-columns:4.6em 1fr;gap:3px 10px;
  margin-top:9px;font-size:13.5px}
.lead .kv dt{color:var(--muted)}
.lead .kv dd{margin:0}
.lead .big{font-size:20px;font-weight:650;letter-spacing:-.03em;color:var(--ochre)}
.lead.alt{border-left-color:var(--muted)}
.lead.alt .nm{font-size:16px}

.dongbar{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
  margin:22px 0 -4px;padding:7px 11px;background:var(--card);
  border:1px solid var(--rule);border-radius:3px;font-size:13px}
.dongbar b{font-weight:640}
.dongbar span{color:var(--muted);font-size:12.5px}
.dongbar button{margin-left:auto;border:1px solid var(--rule);
  border-radius:3px;padding:2px 9px;font-size:12.5px}
</style>
</head>
<body>
<header>
  <h1>청약·미분양·대장아파트 지도</h1>
  <div class="layers" id="layers">
    <button data-l="cy" class="on" aria-pressed="true"><i class="sw"></i>최근 3년 청약<span class="n" id="n-cy"></span></button>
    <button data-l="un" class="on" aria-pressed="true"><i class="sw"></i>준공후 미분양<span class="n" id="n-un"></span></button>
    <button data-l="dj" class="on" aria-pressed="true"><i class="sw"></i>대장아파트<span class="n" id="n-dj"></span></button>
  </div>
  <div class="src" id="src"></div>
</header>

<div class="wrap">
  <div class="left">
    <div class="crumb" id="crumb"></div>
    <div id="map"></div>
    <div class="legend" id="legend"></div>
  </div>
  <div class="right" id="panel">
    <p class="empty">지도를 확대하거나 지역을 눌러 들어가면
      그 지역의 청약 결과, 준공후 미분양, 대장아파트를 함께 보여줍니다.</p>
  </div>
</div>

<script>
/* ──────────────────────────────────────────────────────────────
   자료 읽기
   ────────────────────────────────────────────────────────────── */
const $ = (id) => document.getElementById(id);
const cache = {sgg:{}, emd:{}, region:{}, dj:{}};
let IDX = null, DJI = null, SIDO = null;
let view = {sido: null, sgg: null, dong: null};
let LAYER = {cy: true, un: true, dj: true};
let MAP = null, ready = false;

const SLUG = {서울:'seoul',부산:'busan',대구:'daegu',인천:'incheon',
  대전:'daejeon',울산:'ulsan',세종:'sejong',경기:'gyeonggi',강원:'gangwon',
  충북:'chungbuk',충남:'chungnam',전북:'jeonbuk',전남광주:'jngj',
  경북:'gyeongbuk',경남:'gyeongnam',제주:'jeju'};
const SIDO_FULL = {서울:'서울특별시',부산:'부산광역시',대구:'대구광역시',
  인천:'인천광역시',대전:'대전광역시',울산:'울산광역시',세종:'세종특별자치시',
  경기:'경기도',강원:'강원특별자치도',충북:'충청북도',충남:'충청남도',
  전북:'전북특별자치도',전남광주:'전남광주통합특별시',경북:'경상북도',
  경남:'경상남도',제주:'제주특별자치도'};
const sidoFull = (s) => SIDO_FULL[s] || s;
const fmt = (n) => n == null ? '–' : n.toLocaleString('ko-KR');
const ym = (s) => s ? `${s.slice(0, 4)}년 ${+s.slice(4)}월` : '';
const esc = (t) => String(t ?? '').replace(/[&<>"]/g,
  (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function grab(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url} 를 불러오지 못했습니다 (${r.status})`);
  return r.json();
}
const sggGeo = (s) => cache.sgg[s] || (cache.sgg[s] = grab(`geo/sgg/${SLUG[s]}.json`));
const emdGeo = (s) => cache.emd[s] || (cache.emd[s] = grab(`geo/emd/${SLUG[s]}.json`));
const regionOf = (s) => cache.region[s] || (cache.region[s] = grab(`region/${SLUG[s]}.json`));
const djOf = (s) => cache.dj[s] || (cache.dj[s] = grab(`daejang/${SLUG[s]}.json`));

/* ──────────────────────────────────────────────────────────────
   준공후 미분양 추정
   공식 자료는 시군구 집계뿐이라 단지를 짚어주지 못한다. 그래서
   세 조건을 모두 만족하는 공고를 '추정'으로 표시한다.
     1) 입주예정월이 이미 지났다 (준공했을 것)
     2) 청약에서 미달 타입이 있었다
     3) 그 시군구의 준공후 미분양 통계가 0호가 아니다
   3번이 헛다리를 크게 줄인다. 통계상 한 채도 없는 지역이면
   아무리 미달이었어도 지금은 팔렸다는 뜻이기 때문이다.
   ────────────────────────────────────────────────────────────── */
function estUnsold(R) {
  const after = R && R.unsold && R.unsold.after;
  if (!after) return [];
  const d = new Date();
  const now = d.getFullYear() * 100 + (d.getMonth() + 1);
  return (R.notices || []).filter((n) =>
    n.moveIn && +n.moveIn <= now && n.types.some((t) => t.result === '미달'));
}

/* 대장아파트 화면에 찍을 단지들. 대장 하나만 찍으면 허전해서
   같은 지역의 최고가 단지와 대장후보(분양권)까지 같이 올린다. */
function djPins(D) {
  const out = [];
  const add = (c, kind) => {
    if (c && c.loc) out.push(Object.assign({}, c, {kind}));
  };
  add(D.leader, 'leader');
  if (D.top && (!D.leader || D.top.name !== D.leader.name)) add(D.top, 'top');
  for (const c of D.cand || []) add(c, 'cand');
  return out;
}

/* ──────────────────────────────────────────────────────────────
   지도
   ────────────────────────────────────────────────────────────── */
const KAKAO_KEY = '368b3da5034cf7392bf2390b9f8d1ebe';
const NAT_CENTER = [36.3, 127.8], NAT_LEVEL = 13;
/* 확대 정도로 어느 경계를 보여줄지 정한다. 카카오맵 level 은
   숫자가 작을수록 가깝다. */
const LV_SGG = 11;      // 이보다 가까우면 시군구 경계
const LV_EMD = 7;       // 이보다 가까우면 읍면동 경계
let polys = [], labels = [], pins = [];
let autoMoving = false;  // 우리가 옮기는 중인지 (idle 처리를 건너뛰려고)

function loadSdk() {
  return new Promise((ok, no) => {
    const s = document.createElement('script');
    s.src = `//dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_KEY}&autoload=false`;
    s.onload = () => window.kakao.maps.load(ok);
    s.onerror = () => no(new Error('카카오맵 스크립트를 불러오지 못했습니다'));
    document.head.appendChild(s);
  });
}

function clearOverlays() {
  polys.forEach((p) => p.setMap(null));
  labels.forEach((l) => l.setMap(null));
  polys = []; labels = [];
}
function clearPins() {
  pins.forEach((p) => p.ov.setMap(null));
  pins = [];
  for (const k of ['cy', 'un', 'dj']) $('n-' + k).textContent = '';
}

function bounds(box) {
  const b = new kakao.maps.LatLngBounds();
  b.extend(new kakao.maps.LatLng(box[0], box[1]));
  b.extend(new kakao.maps.LatLng(box[2], box[3]));
  return b;
}

function fitTo(box) {
  autoMoving = true;
  MAP.setBounds(bounds(box));
  // setBounds 는 바로 끝나지만 idle 이 뒤따라 온다. 그 한 번만 건너뛴다.
  setTimeout(() => { autoMoving = false; }, 60);
}

/* 경계 하나를 그린다. rings 가 여럿이면 섬마다 따로 만든다. */
function drawShape(rec, style, onClick, onOver) {
  const made = [];
  for (const ring of rec.rings) {
    const path = ring.map((p) => new kakao.maps.LatLng(p[0], p[1]));
    const poly = new kakao.maps.Polygon(Object.assign({path}, style));
    poly.setMap(MAP);
    if (onClick) kakao.maps.event.addListener(poly, 'click', onClick);
    if (onOver) {
      kakao.maps.event.addListener(poly, 'mouseover',
        () => made.forEach((p) => p.setOptions({fillOpacity: style.fillOpacity + .18})));
      kakao.maps.event.addListener(poly, 'mouseout',
        () => made.forEach((p) => p.setOptions({fillOpacity: style.fillOpacity})));
    }
    made.push(poly);
    polys.push(poly);
  }
  return made;
}

function putLabel(latlng, text, small) {
  const el = document.createElement('div');
  el.className = 'plab' + (small ? ' sm' : '');
  el.textContent = text;
  const ov = new kakao.maps.CustomOverlay({
    position: new kakao.maps.LatLng(latlng[0], latlng[1]),
    content: el, yAnchor: .5, xAnchor: .5, zIndex: 2, clickable: false});
  ov.setMap(MAP);
  labels.push(ov);
}

/* zIndex 를 못박는다. 시군구 위에 읍면동이 겹쳐 그려지는데, 순서를
   운에 맡기면 안쪽 경계를 눌러도 바깥 경계가 먼저 받는다. */
const FILL = {
  sido: {zIndex: 1, strokeWeight: 2, strokeColor: '#5a6150', strokeOpacity: .85,
         fillColor: '#8a9280', fillOpacity: .10},
  sgg:  {zIndex: 2, strokeWeight: 2, strokeColor: '#4a5142', strokeOpacity: .8,
         fillColor: '#8a9280', fillOpacity: .08},
  sel:  {zIndex: 2, strokeWeight: 3, strokeColor: '#2c4a7c', strokeOpacity: .95,
         fillColor: '#2c4a7c', fillOpacity: .06},
  emd:  {zIndex: 3, strokeWeight: 1, strokeColor: '#191c18', strokeOpacity: .35,
         fillColor: '#2c4a7c', fillOpacity: .02},
  emdSel:{zIndex: 4, strokeWeight: 2.5, strokeColor: '#2c4a7c', strokeOpacity: .95,
         fillColor: '#2c4a7c', fillOpacity: .16},
};

/* 지금 상태에 맞는 경계를 다시 그린다. */
async function drawBoundaries() {
  if (!ready) return;
  clearOverlays();
  const lv = MAP.getLevel();

  if (!view.sido || lv > LV_SGG) {
    for (const [name, rec] of Object.entries(SIDO)) {
      drawShape(rec, FILL.sido, () => enterSido(name), true);
      if (rec.label) putLabel(rec.label, name);
    }
    return;
  }

  const sgg = await sggGeo(view.sido);
  for (const [name, rec] of Object.entries(sgg)) {
    const on = name === view.sgg;
    drawShape(rec, on ? FILL.sel : FILL.sgg, () => enterSgg(view.sido, name), !on);
    if (rec.label) putLabel(rec.label, name, Object.keys(sgg).length > 18);
  }

  if (view.sgg && lv <= LV_EMD) {
    try {
      const emd = (await emdGeo(view.sido))[view.sgg];
      if (emd) for (const [dn, rec] of Object.entries(emd)) {
        drawShape(rec, dn === view.dong ? FILL.emdSel : FILL.emd,
          () => pickDong(dn), dn !== view.dong);
        if (rec.label) putLabel(rec.label, dn, true);
      }
    } catch (e) { /* 읍면동이 없는 지역은 그냥 넘어간다 */ }
  }
}

/* ──────────────────────────────────────────────────────────────
   단지 표시
   ────────────────────────────────────────────────────────────── */
function pinEl(cls, title) {
  const el = document.createElement('div');
  el.className = 'pin ' + cls;
  el.title = title;
  return el;
}

function addPin(loc, cls, title, onClick, key) {
  const el = pinEl(cls, title);
  el.addEventListener('click', onClick);
  const ov = new kakao.maps.CustomOverlay({
    position: new kakao.maps.LatLng(loc[0], loc[1]),
    content: el, yAnchor: .5, xAnchor: .5, zIndex: 5, clickable: true});
  ov.setMap(MAP);
  pins.push({ov, el, key});
}

async function drawPins() {
  if (!ready || !view.sido) { clearPins(); return; }
  clearPins();
  const counts = {cy: 0, un: 0, dj: 0};

  const R = await regionOf(view.sido);
  const only = view.sgg;                       // 시군구를 골랐으면 그 안만
  const gus = only ? [only] : Object.keys(R);

  for (const g of gus) {
    const rec = R[g]; if (!rec) continue;
    const est = new Set(estUnsold(rec).map((n) => n.id));

    for (const n of rec.notices || []) {
      if (!n.loc) continue;
      const isUn = est.has(n.id);
      if (isUn) {
        counts.un++;
        if (LAYER.un)
          addPin(n.loc, 'un', `${n.name} · 준공후 미분양 추정`,
            () => focusCard('un-' + n.id), 'un-' + n.id);
      }
      // 미분양 추정으로 찍은 단지는 청약 점으로 또 찍지 않는다
      if (isUn && LAYER.un) continue;
      counts.cy++;
      if (LAYER.cy) {
        const k = n.closedTypes ? 'cy-close' : n.ratedTypes ? 'cy-short' : 'cy-none';
        const r = n.closedTypes ? '마감 포함' : n.ratedTypes ? '전 타입 미달' : '결과 미공개';
        addPin(n.loc, k, `${n.name} · ${n.noticeDate} · ${r}`,
          () => focusCard('nt-' + n.id), 'nt-' + n.id);
      }
    }
  }

  try {
    const D = await djOf(view.sido);
    for (const g of gus) {
      if (!D[g]) continue;
      for (const c of djPins(D[g])) {
        counts.dj++;
        if (!LAYER.dj) continue;
        const id = 'dj-' + g + '-' + c.name;
        addPin(c.loc, 'dj' + (c.kind === 'cand' ? ' cand' : ''),
          `${c.name} · ${c.kind === 'leader' ? '대장' : c.kind === 'cand' ? '대장후보' : '최고가'}`,
          () => focusCard(id), id);
      }
    }
  } catch (e) { /* 대장 자료가 없는 시도는 넘어간다 */ }

  $('n-cy').textContent = counts.cy ? ` ${counts.cy}` : '';
  $('n-un').textContent = counts.un ? ` ${counts.un}` : '';
  $('n-dj').textContent = counts.dj ? ` ${counts.dj}` : '';
  dimPins();
}

/* 읍면동을 고르면 그 안에 없는 점을 흐리게 한다. */
function dimPins() {
  const keep = view.dong ? dongKeys() : null;
  pins.forEach((p) => p.el.classList.toggle('dim', !!keep && !keep.has(p.key)));
}

function focusCard(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.scrollIntoView({behavior: 'smooth', block: 'center'});
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 1400);
}

/* ──────────────────────────────────────────────────────────────
   이동
   ────────────────────────────────────────────────────────────── */
async function enterSido(name) {
  view = {sido: name, sgg: null, dong: null};
  fitTo(SIDO[name].box);
  crumb();
  await drawBoundaries();
  await drawPins();
  renderSido(name);
}

async function enterSgg(sido, sgg) {
  view = {sido, sgg, dong: null};
  const g = await sggGeo(sido);
  if (g[sgg] && g[sgg].box) fitTo(g[sgg].box);
  crumb();
  await drawBoundaries();
  await drawPins();
  renderSgg(sido, sgg);
}

async function goNational() {
  view = {sido: null, sgg: null, dong: null};
  autoMoving = true;
  MAP.setCenter(new kakao.maps.LatLng(NAT_CENTER[0], NAT_CENTER[1]));
  MAP.setLevel(NAT_LEVEL);
  setTimeout(() => { autoMoving = false; }, 60);
  crumb();
  clearPins();
  await drawBoundaries();
  renderNational();
}

function pickDong(name) {
  view.dong = view.dong === name ? null : name;
  drawBoundaries();
  dimPins();
  if (curPanel) renderSgg(curPanel.sido, curPanel.sgg);
}

function crumb() {
  const c = [];
  if (view.sido) c.push('<button id="c-nat">전국</button>');
  else c.push('<b>전국</b><span>지역을 누르거나 확대하세요</span>');
  if (view.sido) {
    if (view.sgg) c.push(`<button id="c-sido">${sidoFull(view.sido)}</button>`);
    else c.push(`<b>${sidoFull(view.sido)}</b><span>시·군·구를 고르세요</span>`);
  }
  if (view.sgg) c.push(`<b>${view.sgg}</b>`);
  $('crumb').innerHTML = c.join('');
  if ($('c-nat')) $('c-nat').onclick = goNational;
  if ($('c-sido')) $('c-sido').onclick = () => enterSido(view.sido);
}

/* 확대·이동이 끝나면 배율에 맞는 경계로 알아서 바꾼다. */
let idleTimer = null;
function onIdle() {
  if (autoMoving) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(async () => {
    const lv = MAP.getLevel();
    if (lv > LV_SGG && view.sido) {        // 많이 빼면 전국으로
      view = {sido: null, sgg: null, dong: null};
      crumb(); clearPins(); await drawBoundaries(); renderNational();
      return;
    }
    const c = MAP.getCenter();
    if (lv <= LV_SGG && !view.sido) {      // 당기면 가운데 시도로 들어간다
      const hit = whichSido(c.getLat(), c.getLng());
      if (hit) {
        view = {sido: hit, sgg: null, dong: null};
        crumb(); await drawBoundaries(); await drawPins(); renderSido(hit);
        return;
      }
    }
    // 더 당기면 가운데 시군구까지. 클릭하지 않고 확대만 해도 들어간다.
    if (lv <= LV_EMD && view.sido && !view.sgg) {
      const g = await sggGeo(view.sido);
      const hit = Object.keys(g).find((k) => inRings(g[k].rings, c.getLat(), c.getLng()));
      if (hit) {
        view = {sido: view.sido, sgg: hit, dong: null};
        crumb(); await drawBoundaries(); await drawPins();
        renderSgg(view.sido, hit);
        return;
      }
    }
    await drawBoundaries();                 // 읍면동 켜짐/꺼짐만 바뀔 때
  }, 180);
}

function inRings(rings, lat, lng) {
  let hit = false;
  for (const ring of rings) {
    let c = false;
    for (let i = 0; i < ring.length - 1; i++) {
      const [y1, x1] = ring[i], [y2, x2] = ring[i + 1];
      if ((y1 > lat) !== (y2 > lat)) {
        const xx = x1 + (lat - y1) * (x2 - x1) / (y2 - y1);
        if (lng < xx) c = !c;
      }
    }
    if (c) hit = !hit;
  }
  return hit;
}
function whichSido(lat, lng) {
  for (const [name, rec] of Object.entries(SIDO))
    if (inRings(rec.rings, lat, lng)) return name;
  return null;
}
function dongKeys() {
  // 고른 동 안에 들어가는 점들의 키. 경계로 직접 판정한다.
  const keep = new Set();
  const rec = curEmd && curEmd[view.dong];
  if (!rec) return keep;
  for (const p of pins) {
    const pos = p.ov.getPosition();
    if (inRings(rec.rings, pos.getLat(), pos.getLng())) keep.add(p.key);
  }
  return keep;
}
let curEmd = null;

/* ──────────────────────────────────────────────────────────────
   오른쪽 패널
   ────────────────────────────────────────────────────────────── */
let curPanel = null;

function figs(list) {
  return `<div class="figs">` + list.map(([k, v, u, c, note]) =>
    `<div class="fig ${c || ''}"><div class="k">${k}</div>
     <div class="v num">${v}${u ? `<span class="u">${u}</span>` : ''}</div>
     ${note ? `<div class="note">${note}</div>` : ''}</div>`).join('') + `</div>`;
}

       <td class="num">${fmt(v.after)}</td><td class="num">${fmt(v.notices)}</td>
       <td class="num">${fmt(v.supply)}</td></tr>`).join('') +
    `</tbody></table></div>
     <p class="foot">표의 시·도를 누르거나 지도를 확대하면 그 지역으로 들어갑니다.</p>`;
  $('panel').querySelectorAll('tr.pick').forEach((tr) =>

  curPanel = null;
  $('panel').innerHTML = '<p class="spin">불러오는 중…</p>';

    .filter(([k]) => k.split('|')[0] === sido)
    .map(([k, v]) => [k.split('|')[1], v])

  $('panel').innerHTML =
    `<h2 class="place">${sidoFull(sido)}</h2>
     <div class="place-sub">시·군·구를 고르면 단지까지 보여줍니다</div>` +
    figs([
      ['미분양', fmt(v.total), '호', 'ochre', `${ym(IDX.meta.unsoldBaseYm)} 기준`],
      ['준공 후 미분양', fmt(v.after), '호', 'ochre', ''],
      ['청약 공고', fmt(v.notices), '건', '', '최근 3년'],

        dj && dj.lead ? `${esc(dj.lead.sgg)} · ${fmt(dj.lead.ppy)}만원/평` : ''],
    ]) +
    `<h3>시·군·구별 <span>미분양 많은 순</span></h3>
     <div class="tw"><table><thead><tr>
       <th>시·군·구</th><th>미분양</th><th>준공 후</th><th>공고</th>
       <th>평균 분양가</th><th>평균 시세</th>

     분양가는 청약 공고의 주택형별 공급금액, 시세는 최근 12개월 매매 실거래
     평균입니다.</p>`;
  $('panel').querySelectorAll('tr.pick').forEach((tr) =>

async function renderSgg(sido, sgg) {
  $('panel').innerHTML = '<p class="spin">불러오는 중…</p>';
  let R, D = null;
  try {
    R = (await regionOf(sido))[sgg] || {notices: [], unsold: {}};
  } catch (e) {
    $('panel').innerHTML = `<p class="empty">${sgg} 자료를 불러오지 못했습니다. ${e.message}</p>`;
    return;
  }
  try { D = (await djOf(sido))[sgg] || null; } catch (e) {}
  try { curEmd = (await emdGeo(sido))[sgg] || null; } catch (e) { curEmd = null; }
  curPanel = {sido, sgg, R, D};

  const M = IDX.meta;
  const all = R.notices || [];
  const est = estUnsold(R);
  const estIds = new Set(est.map((n) => n.id));
  const S = IDX.summary[`${sido}|${sgg}`] || {};
  const supply = all.reduce((a, x) => a + x.supply, 0);

  let h = `<h2 class="place">${sgg}</h2>
    <div class="place-sub">${sidoFull(sido)}</div>` +
    figs([
      ['미분양', fmt(R.unsold && R.unsold.total), '호', 'ochre', `${ym(M.unsoldBaseYm)} 기준`],
      ['준공 후 미분양', fmt(R.unsold && R.unsold.after), '호', 'ochre',
        est.length ? `추정 단지 ${est.length}곳` : ''],
      ['청약 공고', fmt(all.length), '건', '', '최근 3년'],
      ['공급 세대', fmt(supply), '세대', '', ''],
      ['평균 분양가', S.pyeong ? fmt(S.pyeong) : '–', '만원/평', '', ''],
      ['평균 시세', D && D.stats ? fmt(D.stats.med) : '–', '만원/평', '',
        D && D.stats ? '실거래 중위' : ''],
    ]);

  if (view.dong) {
    h += `<div class="dongbar"><b>${view.dong}</b>
      <span>이 동만 보는 중</span>
      <button id="alldong">${sgg} 전체</button></div>`;
  }

  // ── 준공후 미분양 (추정)
  if (LAYER.un) {
    h += `<h3><i class="sw un"></i>준공후 미분양 <span>추정 ${est.length}곳</span></h3>`;
    h += est.length
      ? est.map((n) => noticeCard(n, 'un-')).join('')
      : `<p class="empty" style="margin-top:12px">${
          R.unsold && R.unsold.after
            ? '이 시·군·구에 준공후 미분양이 집계되지만, 최근 3년 청약 공고 중에서는 짚이는 단지가 없습니다.'
            : `${ym(M.unsoldAfterBaseYm)} 기준 이 지역의 준공후 미분양은 0호입니다.`}</p>`;
  }

  // ── 대장아파트
  if (LAYER.dj) {
    h += `<h3><i class="sw dj"></i>대장아파트 <span>${
      D && D.tiers ? esc(D.tiers[(D.leader && D.leader.tier) || 0] || '') : '자료 없음'}</span></h3>`;
    if (D && D.leader) h += leadCard(D.leader, 'leader', sgg);
    if (D && D.top && (!D.leader || D.top.name !== D.leader.name))
      h += leadCard(D.top, 'top', sgg);
    for (const c of (D && D.cand) || []) h += leadCard(c, 'cand', sgg);
    if (!D) h += `<p class="empty" style="margin-top:12px">이 지역은 실거래가 적어
      대장 판정을 하지 못했습니다.</p>`;
  }

  // ── 청약 공고
  if (LAYER.cy) {
    const list = all.filter((n) => !(LAYER.un && estIds.has(n.id)));
    h += `<h3><i class="sw cy"></i>청약 공고 <span>최근 3년 ${list.length}건</span></h3>`;
    if (!list.length) {
      h += `<p class="empty" style="margin-top:12px">${M.noticeFrom} 이후
        이 지역의 아파트 분양 공고가 없습니다.</p>`;
    } else {
      const byYear = {};
      for (const n of list) (byYear[n.noticeDate.slice(0, 4)] ||= []).push(n);
      h += Object.keys(byYear).sort().reverse().map((y, i) => {
        const g = byYear[y];
        const sup = g.reduce((a, x) => a + x.supply, 0);
        return `<details class="yr"${i === 0 ? ' open' : ''}>
          <summary><b>${y}년</b><span class="num">${g.length}건</span>
            <i class="num">공급 ${fmt(sup)}세대</i></summary>
          ${g.map((n) => noticeCard(n, 'nt-')).join('')}</details>`;
      }).join('');
    }
  }

  h += `<div class="foot">
    청약 자료는 한국부동산원 청약홈(공공데이터포털), 미분양은 국토교통부
    미분양주택현황보고(KOSIS) ${ym(M.unsoldBaseYm)} 기준입니다.
    시세와 대장 판정은 국토교통부 아파트 매매 실거래가 최근 12개월
    자료이며 공급면적 평당가입니다.
    <b>준공후 미분양 단지는 추정치입니다.</b> 전국 단지별 공식 자료가 없어,
    입주예정월이 지났고 청약에서 미달 타입이 있었으며 그 시·군·구의 준공후
    미분양이 0호가 아닌 공고를 골라낸 것입니다. 실제 분양 상태와 다를 수
    있으니 확인이 필요합니다.
    자료 생성 ${M.generated}.</div>`;

  $('panel').innerHTML = h;
  if ($('alldong')) $('alldong').onclick = () => pickDong(view.dong);
}

function noticeCard(n, idp) {
  const tags = [];
  if (idp === 'un-') tags.push('<span class="tag est">준공후 미분양 추정</span>');
  if (n.kind) tags.push(`<span class="tag">${esc(n.kind)}</span>`);
  if (n.rent && n.rent !== '분양주택') tags.push(`<span class="tag">${esc(n.rent)}</span>`);
  if (n.speculative) tags.push('<span class="tag hot">투기과열지구</span>');
  if (n.priceCap) tags.push('<span class="tag cap">분양가상한제</span>');

  const rows = n.types.map((t) => {
    const cls = t.result === '마감' ? 'r-close' : t.result === '미달' ? 'r-short' : 'r-none';
    const res = t.result === '마감'
      ? `${t.closedAt} 마감 <span class="num">${t.rate}:1</span>`
      : t.result === '미달' ? '미달' : '결과 미공개';
    return `<tr><td>${esc(t.ty)}</td><td class="num">${t.area ?? '–'}</td>
      <td class="num">${fmt(t.gnrl)}</td><td class="num">${fmt(t.spsply)}</td>
      <td class="num">${t.amount ? fmt(t.amount) : '–'}</td>
      <td class="num">${t.pyeong ? fmt(t.pyeong) : '–'}</td>
      <td class="${cls}">${res}</td></tr>`;
  }).join('');

  const meta = [n.builder, n.totalHshld ? `${fmt(n.totalHshld)}세대` : null,
    n.moveIn ? `${n.moveIn.slice(0, 4)}년 ${+n.moveIn.slice(4)}월 입주 예정` : null,
    n.avgPyeong ? `평균 ${fmt(n.avgPyeong)}만원/평` : null].filter(Boolean).join(' · ');
  const dot = n.closedTypes ? 'close' : n.ratedTypes ? 'short' : 'none';

  return `<div class="nt" id="${idp}${n.id}">
    <div class="nt-hd"><span class="nm"><span class="dot ${dot}"></span>${esc(n.name)}</span>
      <span class="dt num">공고 ${n.noticeDate}</span></div>
    <div class="nt-meta">${esc(meta)}</div>
    <div class="nt-meta">${esc(n.addr || '')}</div>
    <div class="tags">${tags.join('')}</div>
    <div class="tw"><table><thead><tr><th>주택형</th><th>공급면적</th>
      <th>일반</th><th>특별</th><th>분양가</th><th>평당가</th><th>청약 결과</th>
      </tr></thead><tbody>${rows}</tbody></table></div>
    <div class="lk">${n.url
      ? `<a href="${esc(n.url)}" target="_blank" rel="noopener">청약홈 공고 상세</a>` : ''}
      ${n.homepage
      ? ` · <a href="${esc(n.homepage)}" target="_blank" rel="noopener">분양 홈페이지</a>` : ''}
    </div></div>`;
}

function leadCard(c, kind, sgg) {
  const title = kind === 'leader' ? '대장' : kind === 'cand' ? '대장후보' : '최고 평당가';
  const s = c.silv || c;
  const tags = [];
  if (c.brand) tags.push(`<span class="tag brand">${esc(c.brand)}</span>`);
  if (c.hh) tags.push(`<span class="tag">${fmt(c.hh)}세대</span>`);
  if (c.by) tags.push(`<span class="tag">${c.by}년</span>`);
  if (kind === 'cand') tags.push(`<span class="tag est">${esc(c.status || '분양권')}</span>`);
  return `<div class="lead${kind === 'leader' ? '' : ' alt'}" id="dj-${esc(sgg)}-${esc(c.name)}">
    <div class="nt-meta">${title}</div>
    <div class="nm">${esc(c.name)}</div>
    <dl class="kv">
      <dt>위치</dt><dd>${esc(c.dong || '')} ${esc(c.road || c.jibun || '')}</dd>
      <dt>평당가</dt><dd class="big num">${s.ppy ? fmt(s.ppy) : '–'}
        <span style="font-size:13px;font-weight:450;color:var(--muted)">만원/평</span></dd>
      ${s.p84 ? `<dt>84㎡</dt><dd class="num">${fmt(s.p84)}만원</dd>` : ''}
      ${s.last ? `<dt>최근</dt><dd class="num">${s.last.d} · ${fmt(s.last.amt)}만원
        · ${s.last.ar}㎡</dd>` : ''}
    </dl>
    <div class="tags">${tags.join('')}</div></div>`;
}

/* ──────────────────────────────────────────────────────────────
   레이어 토글
   ────────────────────────────────────────────────────────────── */
$('layers').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-l]');
  if (!b) return;
  const k = b.dataset.l;
  LAYER[k] = !LAYER[k];
  b.classList.toggle('on', LAYER[k]);
  b.setAttribute('aria-pressed', String(LAYER[k]));
  drawPins();
  if (curPanel) renderSgg(curPanel.sido, curPanel.sgg);
});

function legend() {
  const p = [];
  if (LAYER.cy) p.push(`<span><i style="background:var(--blue)"></i>마감 타입 있음</span>
    <span><i style="background:var(--warn)"></i>전 타입 미달</span>
    <span><i style="background:var(--muted)"></i>결과 미공개</span>`);
  if (LAYER.un) p.push('<span><i class="un"></i>준공후 미분양 추정</span>');
  if (LAYER.dj) p.push('<span><i class="dj"></i>대장·최고가 단지</span>');
  $('legend').innerHTML = p.join('') ||
    '<span>레이어를 하나 이상 켜주세요.</span>';
}

/* ──────────────────────────────────────────────────────────────
   시작
   ────────────────────────────────────────────────────────────── */
(async function () {
  try {
    [IDX, SIDO] = await Promise.all([grab('index.json'), grab('geo/sido.json')]);
    try { DJI = await grab('daejang/index.json'); } catch (e) { DJI = null; }
    $('src').innerHTML =
      `청약 한국부동산원 청약홈 · 미분양 국토교통부 ${ym(IDX.meta.unsoldBaseYm)} 기준
       <br>최근 3년 아파트 공고 ${fmt(IDX.meta.noticeCount)}건${
         DJI ? ` · 시세 실거래 ${fmt(DJI.meta.trades)}건` : ''}`;
  } catch (e) {
    $('panel').innerHTML = `<p class="empty">자료를 불러오지 못했습니다. ${esc(e.message)}
      <br><br>같은 폴더에서 <code>python3 -m http.server 8000</code> 을 실행한 뒤
      <code>http://localhost:8000</code> 으로 여세요.</p>`;
    return;
  }
  legend();
  renderNational();

  try {
    await loadSdk();
    MAP = new kakao.maps.Map($('map'), {
      center: new kakao.maps.LatLng(NAT_CENTER[0], NAT_CENTER[1]),
      level: NAT_LEVEL});
    MAP.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
    ready = true;
    kakao.maps.event.addListener(MAP, 'idle', onIdle);
    crumb();
    await drawBoundaries();
  } catch (e) {
    $('map').innerHTML = `<div class="maperr">지도를 불러오지 못했습니다.
      ${esc(e.message)}<br><br>
      카카오 개발자 사이트에서 이 주소를 <b>플랫폼 &gt; Web</b> 에 등록했는지,
      <b>카카오맵</b> 제품이 켜져 있는지 확인해 주세요.<br>
      지금 주소: <code>${esc(location.origin)}</code><br><br>
      지도 없이도 오른쪽 목록과 아래 표는 그대로 쓸 수 있습니다.</div>`;
  }
})();
</script>
